<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- Inline so that a portal on a listener of its own never asks the origin for
     a favicon it does not serve. -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="%232f6feb"/><path d="M9.5 16.5l4.5 4.5 8.5-10" fill="none" stroke="%23fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>我的 DNS 账号</title>
<style>
:root {
  --bg: #f5f6f8; --card: #fff; --fg: #1b1d22; --muted: #6b7280;
  --line: #e3e5ea; --accent: #2f6feb; --accent-fg: #fff; --bad: #d1242f;
  --good: #1a7f37; --warn: #9a6700; --track: #eceef2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d; --card: #1e2127; --fg: #e6e8ec; --muted: #9aa1ad;
    --line: #2c3038; --accent: #4c8dff; --accent-fg: #0d1117; --bad: #f85149;
    --good: #3fb950; --warn: #d29922; --track: #2c3038;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); min-height: 100vh;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding: 16px calc(14px + env(safe-area-inset-right))
           calc(48px + env(safe-area-inset-bottom))
           calc(14px + env(safe-area-inset-left));
}
h1 { font-size: 19px; margin: 0; font-weight: 650; }
h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600;
     letter-spacing: .02em; }
.card { background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
button {
  font: inherit; border: 1px solid var(--line); background: var(--card);
  color: var(--fg); border-radius: 9px; padding: 9px 14px; cursor: pointer;
  min-height: 40px;
}
button.primary { background: var(--accent); border-color: var(--accent);
                 color: var(--accent-fg); font-weight: 600; }
button:disabled { opacity: .55; cursor: default; }
button.wide { width: 100%; }
input {
  font: inherit; width: 100%; padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  min-height: 42px;
}
label { display: block; margin-bottom: 12px; }
label > span { display: block; margin-bottom: 5px; font-size: 13px;
               color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); cursor: pointer; font-size: 13px;
}
.chip .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.copied { border-color: var(--good); color: var(--good); }
.bar { height: 6px; border-radius: 3px; background: var(--track);
       overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--accent);
           border-radius: 3px; transition: width .3s; }
.bar.over > i { background: var(--bad); }
.badge { padding: 2px 8px; border-radius: 999px; font-size: 12px;
         border: 1px solid var(--line); }
.badge.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
/* 固定 30 个槽位，缺失的日子画成空槽，柱子有宽度上限：即使只有一天数据，
   也能看出它在时间轴上的位置，而不是一根占满宽度的色块。 */
.spark { display: flex; align-items: flex-end; justify-content: flex-start;
         gap: 2px; height: 44px; margin-top: 6px;
         border-bottom: 1px solid var(--line); padding-bottom: 2px; }
/* 每格是一条通高的淡底轨道，填充从底部往上画。轨道让 30 个格子一眼能数出
   来，而"填充高度 = 当天用量"不会把没数据的日子误读成有用量。 */
.spark > span { flex: 1 1 0; max-width: 16px; height: 100%;
                background: var(--track); opacity: .6; border-radius: 3px;
                display: flex; align-items: flex-end; overflow: hidden; }
.spark > span > i { display: block; width: 100%; height: 0;
                    background: var(--accent); border-radius: 3px; }
.spark > span.today { outline: 1px solid var(--accent); outline-offset: 1px; }
.axis { display: flex; justify-content: space-between; margin-top: 4px;
        font-size: 11px; color: var(--muted); }
/* 日志用 flex 行而不是 table：table 的 table-layout:auto 会让
   text-overflow: ellipsis 失效，超长域名会被硬切掉。 */
.logrow { display: flex; gap: 10px; align-items: flex-start;
          padding: 8px 0; border-top: 1px solid var(--line); }
.logrow:first-child { border-top: 0; }
.logrow > .badge { flex: 0 0 auto; margin-top: 1px; }
.logmain { flex: 1 1 auto; min-width: 0; }
.logmain .host { font-size: 14px; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
.logmain .meta { font-size: 12px; color: var(--muted); margin-top: 2px;
                 overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
tr:first-child td { border-top: 0; }
.host { overflow-wrap: anywhere; }
/* 元信息用 flex-wrap 排版，分隔符由 CSS 前缀生成并跟随它后面的那一项，
   这样换行时不会在行尾留下一个孤立的"·"。 */
.metarow { display: flex; flex-wrap: wrap; column-gap: 0; row-gap: 2px; }
.metarow > span { white-space: nowrap; }
.metarow > span + span::before { content: " · "; }

.alert { border-radius: 9px; padding: 10px 12px; margin-bottom: 12px;
         font-size: 13px; display: none; }
.alert.show { display: block; }
.alert.err { background: color-mix(in srgb, var(--bad) 14%, transparent);
             color: var(--bad); }
.hidden { display: none !important; }
.center { text-align: center; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
       font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <section id="login-view">
    <div class="row" style="margin:18px 0 16px">
      <h1 id="login-title">我的 DNS 账号</h1>
    </div>
    <div class="card">
      <div id="login-alert" class="alert err"></div>
      <form id="login-form" autocomplete="on">
        <label>
          <span>标识或名称</span>
          <input id="login-name" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 required>
        </label>
        <label>
          <span>密码</span>
          <input id="login-pass" name="password" type="password"
                 autocomplete="current-password" required>
        </label>
        <button id="login-btn" class="primary wide" type="submit">登录</button>
      </form>
    </div>
    <p class="tiny muted center" id="login-hint"></p>
    <p class="tiny muted center hidden" id="login-register">
      还没有账号？<a href="#" id="login-register-link">立即注册</a>
    </p>
  </section>

  <!-- 面板 -->
  <section id="register-view" class="hidden">
    <div class="row" style="margin:18px 0 16px">
      <h1>注册账号</h1>
    </div>

    <div class="card">
      <div id="register-alert" class="alert err"></div>
      <form id="register-form" autocomplete="on">
        <label class="tiny muted" for="register-name">名称（可留空）</label>
        <input id="register-name" name="name" autocomplete="nickname"
               placeholder="给自己起个名字">

        <div id="register-email-block" class="hidden">
          <label class="tiny muted" for="register-email">邮箱</label>
          <div class="row" style="gap:8px">
            <input id="register-email" name="email" type="email" autocomplete="email"
                   placeholder="you@example.com" style="flex:1">
            <button id="register-code-btn" class="small" type="button">发验证码</button>
          </div>
          <label class="tiny muted" for="register-code">验证码</label>
          <input id="register-code" name="code" inputmode="numeric" autocomplete="one-time-code"
                 placeholder="6 位数字">
        </div>

        <label class="tiny muted" for="register-pass">密码</label>
        <input id="register-pass" name="password" type="password" autocomplete="new-password"
               placeholder="至少 8 位" required>

        <button id="register-btn" class="primary wide" type="submit">注册</button>
      </form>
    </div>

    <p class="tiny muted center" style="margin:14px 0 0">
      注册后系统会分配一个专属标识，它就是你的 DoT / DoH 域名前缀，<b>不可更改</b>。
    </p>
    <p class="tiny muted center" style="margin:10px 0 0">
      <a href="#" id="register-back">返回登录</a>
    </p>
  </section>

  <section id="panel-view" class="hidden">
    <div class="row spread" style="margin:16px 0 14px">
      <h1 id="account-name">我的账号</h1>
      <button id="logout-btn" class="small">退出</button>
    </div>
    <div id="panel-alert" class="alert err"></div>
    <div id="announcement" class="card hidden" style="border-left:3px solid var(--blue,#2f6feb)">
      <div class="tiny muted" style="margin-bottom:6px">公告</div>
      <div id="announcement-text" class="small" style="white-space:pre-wrap"></div>
    </div>

    <div class="card">
      <h2>连接信息</h2>
      <div id="hosts" class="row"></div>
      <p class="tiny muted" id="hosts-hint" style="margin:10px 0 0"></p>
    </div>

    <div class="card">
      <h2>用量与配额</h2>
      <div class="row spread">
        <span id="usage-text" class="mono">—</span>
        <span id="status-badge" class="badge">—</span>
      </div>
      <div class="bar" id="usage-bar"><i style="width:0"></i></div>
      <p class="tiny muted" id="reset-hint" style="margin:0"></p>
    </div>

    <div class="card" id="history-card">
      <h2>近 30 天用量</h2>
      <div class="spark" id="spark"></div>
      <div class="axis">
        <span id="axis-start"></span>
        <span id="axis-end"></span>
      </div>
      <p class="tiny muted" id="history-hint" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>账号设置</h2>

      <div class="row spread" style="margin-bottom:4px">
        <span class="tiny muted">邮箱</span>
        <span id="email-state" class="tiny muted">未绑定</span>
      </div>
      <div class="row" style="gap:8px">
        <input id="email-input" type="email" placeholder="you@example.com" style="flex:1">
        <button id="email-code-btn" class="small">发验证码</button>
      </div>
      <div class="row" style="gap:8px;margin-top:8px">
        <input id="email-code" inputmode="numeric" placeholder="验证码" style="flex:1">
        <button id="email-bind-btn" class="small primary">绑定</button>
        <button id="email-clear-btn" class="small hidden">解绑</button>
      </div>
      <p class="tiny muted" id="email-hint" style="margin:8px 0 0"></p>

      <hr style="border:0;border-top:1px solid var(--line,#e5e7eb);margin:16px 0">

      <div class="tiny muted" style="margin-bottom:8px">修改密码</div>
      <input id="pass-old" type="password" autocomplete="current-password" placeholder="当前密码">
      <input id="pass-new" type="password" autocomplete="new-password"
             placeholder="新密码（至少 8 位）" style="margin-top:8px">
      <button id="pass-btn" class="small" style="margin-top:10px">修改密码</button>
      <p class="tiny muted" id="pass-hint" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>查询日志</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="log-term" placeholder="按域名筛选，留空看全部"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               style="flex:1;min-width:180px">
        <button id="log-refresh">刷新</button>
      </div>
      <div id="log-body"><p class="small muted">加载中…</p></div>
      <div class="row" style="margin-top:10px">
        <button id="log-more" class="wide small hidden">加载更多</button>
      </div>
    </div>
  </section>

</div>

<!-- config.js 由管理端的「门户部署」生成，里面的 apiBase 指向 API 的地址；
     自带页面里它是空值，表示与页面同源。 -->
<script src="config.js"></script>

<script>
"use strict";

// API_BASE 留空表示与页面同源。独立部署（前端在国外、API 在国内）时由
// config.js 提供国内 API 的地址，例如 "https://dns.example.com:3004"。
// 同时必须把该页面的来源加进管理端设置里的「门户来源」，否则浏览器会拦下
// 跨域请求。
var API_BASE = (window.AGHUB_PORTAL_CONFIG && window.AGHUB_PORTAL_CONFIG.apiBase) || "";

// 地址末尾的斜杠会让拼接出的路径变成 "//portal/api/…"，服务端会 404。
if (API_BASE.slice(-1) === "/") {
  API_BASE = API_BASE.slice(0, -1);
}

var PAGE_SIZE = 100;
var MAX_KEPT = 1000;

var $ = function (id) { return document.getElementById(id); };

function api(path, opts) {
  opts = opts || {};
  return fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "include",
    cache: "no-store",
  });
}

function showAlert(el, msg) {
  el.textContent = msg || "";
  el.classList.toggle("show", !!msg);
}

function fmtDate(sec) {
  if (!sec) { return "—"; }
  var d = new Date(sec * 1000);
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function fmtLeft(sec) {
  if (sec == null || sec < 0) { return "永久"; }
  if (sec === 0) { return "已到期"; }
  var d = Math.floor(sec / 86400);
  if (d >= 1) { return d + " 天"; }
  var h = Math.floor(sec / 3600);
  if (h >= 1) { return h + " 小时"; }
  return Math.max(1, Math.floor(sec / 60)) + " 分钟";
}

var STATUS = {
  active: ["正常", "ok"],
  disabled: ["已停用", "bad"],
  expired: ["已到期", "bad"],
  over_quota: ["已超额", "bad"],
  expiring_soon: ["即将到期", "warn"],
};

/* ---------- 登录 ---------- */

function showLogin(msg) {
  $("panel-view").classList.add("hidden");
  $("register-view").classList.add("hidden");
  $("login-view").classList.remove("hidden");
  showAlert($("login-alert"), msg);
}

function showPanel() {
  $("login-view").classList.add("hidden");
  $("register-view").classList.add("hidden");
  $("panel-view").classList.remove("hidden");
}

function showRegister() {
  $("login-view").classList.add("hidden");
  $("panel-view").classList.add("hidden");
  $("register-view").classList.remove("hidden");
  showAlert($("register-alert"), "");
}

$("login-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var btn = $("login-btn");
  btn.disabled = true;
  showAlert($("login-alert"), "");

  api("/portal/api/login", {
    method: "POST",
    body: { login: $("login-name").value, password: $("login-pass").value },
  }).then(function (r) {
    if (r.ok) { return r.json(); }
    if (r.status === 401) { throw new Error("标识或密码不对"); }
    if (r.status === 429) { throw new Error("尝试太频繁，请过一会儿再试"); }
    throw new Error("登录失败（HTTP " + r.status + "）");
  }).then(function (d) {
    $("login-pass").value = "";
    showPanel();
    renderUser(d.user);
    return loadLog(true);
  }).catch(function (err) {
    showAlert($("login-alert"), err.message);
  }).finally(function () {
    btn.disabled = false;
  });
});

$("logout-btn").addEventListener("click", function () {
  api("/portal/api/logout", { method: "POST" }).finally(function () {
    log = [];
    showLogin("已退出");
  });
});

/* ---------- 账号 ---------- */

function renderUser(u) {
  if (!u) { return; }
  $("account-name").textContent = u.name || u.uid;

  // 连接信息
  var hosts = $("hosts");
  hosts.textContent = "";
  var list = u.hosts || [];
  if (list.length === 0) {
    hosts.innerHTML = '<span class="small muted">' +
      "你的账号是按来源地址识别的，直接用管理员给你的 DNS 地址即可，" +
      "不需要在客户端里填写主机名。" + "</span>";
  }
  list.forEach(function (h) {
    var el = document.createElement("button");
    el.className = "chip";
    el.type = "button";
    el.title = "点击复制";
    el.innerHTML = '<span class="host mono"></span><span class="tiny">复制</span>';
    el.querySelector(".host").textContent = h;
    el.addEventListener("click", function () {
      copy(h, el);
    });
    hosts.appendChild(el);
  });
  $("hosts-hint").textContent = (u.domain && list.length > 0)
    ? "DoT 主机名就是上面这些；DoH 地址在主机名后加 /dns-query。"
    : "";

  // 用量与配额
  var used = u.requests || 0;
  var limit = u.request_limit;
  var unlimited = !limit || limit < 0;
  $("usage-text").textContent = unlimited
    ? used.toLocaleString() + " 次（不限量）"
    : used.toLocaleString() + " / " + limit.toLocaleString();

  var bar = $("usage-bar");
  var pct = unlimited ? 0 : Math.min(100, Math.round(used / limit * 100));
  bar.querySelector("i").style.width = (unlimited ? 100 : pct) + "%";
  bar.classList.toggle("over", !unlimited && used >= limit);

  var st = STATUS[u.status] || [u.status || "未知", ""];
  var badge = $("status-badge");
  badge.textContent = st[0];
  badge.className = "badge " + st[1];

  // 每一项都是不可断行的整体，窄屏上换行也不会把"永久"这类词拆开。
  var parts = [];
  parts.push("周期：" + (u.period === "day" ? "每天" : u.period === "week"
    ? "每周" : u.period === "month" ? "每月" : "总量"));
  if (u.next_reset) { parts.push("下次重置：" + fmtDate(u.next_reset)); }
  if (u.expires_at) { parts.push("到期：" + fmtDate(u.expires_at)); }
  parts.push("有效期剩余：" + fmtLeft(u.remaining_seconds));

  var hint = $("reset-hint");
  hint.className = "tiny muted metarow";
  hint.style.margin = "0";
  hint.textContent = "";
  parts.forEach(function (t) {
    var sp = document.createElement("span");
    sp.textContent = t;
    hint.appendChild(sp);
  });

  renderHistory(u.history, u);
}

function copy(text, el) {
  var done = function () {
    el.classList.add("copied");
    var t = el.querySelector(".tiny");
    if (t) { t.textContent = "已复制"; }
    setTimeout(function () {
      el.classList.remove("copied");
      if (t) { t.textContent = "复制"; }
    }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  } else {
    fallback();
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  }
}

var HISTORY_DAYS = 30;

function fmtDay(d) {
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

// 固定画出 30 个槽位，缺失的日子留空槽。服务端只在有活动之后才开始记历史，
// 所以新用户一开始只有一天数据；如果按"有几天画几根"，一天就会被拉成一整块
// 色块，看不出任何时间位置。
function renderHistory(history, u) {
  var spark = $("spark");
  spark.textContent = "";
  history = history || [];

  var byDate = {};
  history.forEach(function (p) { byDate[p.date] = p.requests; });

  // 以服务端给的最后一天为锚点，避免浏览器时区与服务端不一致。
  var last = history.length
    ? history[history.length - 1].date
    : fmtDay(new Date());
  var parts = last.split("-");
  var end = new Date(+parts[0], +parts[1] - 1, +parts[2]);

  // 纵轴以每日配额为满格，这样柱高有绝对含义（用了 11/50 就是约 22% 高）。
  // 只按历史最大值缩放的话，只有一天数据时那一天必然画成满格，会被误读成
  // "配额用完了"。配额不限或周期不是每天时才退回按最大值缩放。
  var max = 1;
  history.forEach(function (p) { if (p.requests > max) { max = p.requests; } });
  if (u && u.period === "day" && u.request_limit > 0) {
    max = Math.max(max, u.request_limit);
  }

  for (var i = HISTORY_DAYS - 1; i >= 0; i--) {
    var d = new Date(end.getFullYear(), end.getMonth(), end.getDate() - i);
    var date = fmtDay(d);
    var n = byDate[date];
    var b = document.createElement("span");
    var fill = document.createElement("i");
    if (n === undefined) {
      b.title = date + "：无记录";
    } else {
      // 填充占整格高度的比例，最少 8% 以免少量用量看不见。
      fill.style.height = Math.max(8, Math.round(n / max * 100)) + "%";
      b.title = date + "：" + n + " 次";
    }
    if (i === 0) { b.className = "today"; }
    b.appendChild(fill);
    spark.appendChild(b);
  }

  var startDate = new Date(end.getFullYear(), end.getMonth(),
    end.getDate() - (HISTORY_DAYS - 1));
  $("axis-start").textContent = fmtDay(startDate).slice(5);
  $("axis-end").textContent = fmtDay(end).slice(5) + " 今天";

  var total = 0;
  history.forEach(function (p) { total += p.requests; });

  if (history.length === 0) {
    $("history-hint").textContent =
      "还没有用量记录，这里会显示最近 30 天的趋势。";
  } else if (history.length === 1) {
    $("history-hint").textContent =
      history[0].date + "，共 " + total.toLocaleString() +
      " 次请求（只有一天数据）。";
  } else {
    $("history-hint").textContent =
      history[0].date + " 至 " + last + "，共 " +
      total.toLocaleString() + " 次请求。";
  }
}

/* ---------- 查询日志 ---------- */

var log = [];
var exhausted = false;
var loading = false;

function entryHost(e) {
  var q = e.question || {};
  return q.unicode_name || q.name || "";
}

function entryStatus(e) {
  // 接口给的是 filtering.Reason 的字符串形式，例如 FilteredBlockList、
  // Rewritten、NotFilteredNotFound。
  var r = e.reason || "";
  if (r === "Rewritten") { return ["warn", "改写"]; }
  if (r.indexOf("Filtered") === 0) { return ["bad", "拦截"]; }
  return ["", "通过"];
}

function renderLog() {
  var body = $("log-body");
  if (log.length === 0) {
    body.innerHTML = '<p class="small muted">没有记录。</p>';
    $("log-more").classList.add("hidden");
    return;
  }
  var frag = document.createDocumentFragment();
  log.forEach(function (e) {
    var st = entryStatus(e);
    var row = document.createElement("div");
    row.className = "logrow";

    var badge = document.createElement("span");
    badge.className = "badge " + st[0];
    badge.textContent = st[1];

    var main = document.createElement("div");
    main.className = "logmain";

    var host = document.createElement("div");
    host.className = "host";
    host.textContent = entryHost(e) || "—";
    host.title = host.textContent;

    var meta = document.createElement("div");
    meta.className = "meta";
    var parts = [];
    if (e.question && e.question.type) { parts.push(e.question.type); }
    if (e.time) { parts.push(fmtDate(Date.parse(e.time) / 1000)); }
    if (e.client) { parts.push(e.client); }
    meta.textContent = parts.join(" · ");

    main.appendChild(host);
    main.appendChild(meta);
    row.appendChild(badge);
    row.appendChild(main);
    frag.appendChild(row);
  });
  body.textContent = "";
  body.appendChild(frag);
  $("log-more").classList.toggle("hidden", exhausted || log.length >= MAX_KEPT);
}

function loadLog(reset) {
  if (loading) { return Promise.resolve(); }
  loading = true;
  var more = $("log-more");
  more.disabled = true;

  var term = $("log-term").value.trim();
  var path = "/portal/api/log?limit=" + PAGE_SIZE;
  if (term) { path += "&term=" + encodeURIComponent(term); }
  if (!reset && log.length > 0) {
    // 用最后一条的时间做游标，避免重复。
    var last = log[log.length - 1];
    if (last && last.time) {
      path += "&older_than=" + encodeURIComponent(last.time);
    }
  }

  return api(path).then(function (r) {
    if (r.status === 401) {
      throw new Error("登录已失效，请重新登录");
    }
    if (!r.ok) { throw new Error("加载失败（HTTP " + r.status + "）"); }
    return r.json();
  }).then(function (d) {
    var data = (d && d.data) || [];
    if (reset) { log = []; }
    log = log.concat(data);
    if (log.length > MAX_KEPT) { log = log.slice(0, MAX_KEPT); }
    exhausted = data.length < PAGE_SIZE;
    renderLog();
    showAlert($("panel-alert"), "");
  }).catch(function (err) {
    showAlert($("panel-alert"), err.message);
    if (/登录已失效/.test(err.message)) { showLogin(err.message); }
  }).finally(function () {
    loading = false;
    more.disabled = false;
  });
}

$("log-refresh").addEventListener("click", function () {
  exhausted = false;
  loadLog(true);
});
$("log-more").addEventListener("click", function () { loadLog(false); });
$("log-term").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { exhausted = false; loadLog(true); }
});

/* ---------- 注册与账号设置 ---------- */

// 由 /portal/api/config 填充：注册开关、是否要邮箱验证、公告。
var PORTAL_CONFIG = {
  registration_open: false,
  email_required: false,
  announcement: "",
};

function loadConfig() {
  return api("/portal/api/config").then(function (r) {
    if (!r.ok) { return null; }
    return r.json();
  }).then(function (d) {
    if (d) { PORTAL_CONFIG = d; }

    $("login-register").classList.toggle("hidden", !PORTAL_CONFIG.registration_open);
    $("register-email-block").classList.toggle("hidden", !PORTAL_CONFIG.email_required);

    var text = PORTAL_CONFIG.announcement || "";
    $("announcement-text").textContent = text;
    $("announcement").classList.toggle("hidden", !text);
  }).catch(function () {
    // 配置拉不到不该挡住登录，按最保守的默认值继续。
  });
}

/* ---------- 注册 ---------- */

$("login-register-link").addEventListener("click", function (e) {
  e.preventDefault();
  showRegister();
});

$("register-back").addEventListener("click", function (e) {
  e.preventDefault();
  showLogin("");
});

// 验证码按钮：发送成功后进入倒计时，免得连点把服务器当发信机用。
function codeButton(btn, getEmail, alertEl) {
  var left = 0;
  var timer = null;
  var label = btn.textContent;

  var tick = function () {
    if (left <= 0) {
      clearInterval(timer);
      timer = null;
      btn.disabled = false;
      btn.textContent = label;
      return;
    }

    btn.textContent = left + " 秒后可重发";
    left -= 1;
  };

  btn.addEventListener("click", function () {
    var email = (getEmail() || "").trim();
    if (!email) {
      showAlert(alertEl, "请先填邮箱");
      return;
    }

    btn.disabled = true;
    showAlert(alertEl, "");

    api("/portal/api/email/code", { method: "POST", body: { email: email } })
      .then(function (r) {
        if (r.ok) { return null; }
        if (r.status === 429) { throw new Error("发送太频繁，请稍后再试"); }
        if (r.status === 503) { throw new Error("管理员还没有配置邮件服务器"); }
        throw new Error("发送失败（HTTP " + r.status + "）");
      })
      .then(function () {
        left = 60;
        tick();
        timer = setInterval(tick, 1000);
      })
      .catch(function (err) {
        showAlert(alertEl, err.message);
        btn.disabled = false;
      });
  });
}

codeButton($("register-code-btn"),
  function () { return $("register-email").value; }, $("register-alert"));

$("register-form").addEventListener("submit", function (e) {
  e.preventDefault();

  var btn = $("register-btn");
  btn.disabled = true;
  showAlert($("register-alert"), "");

  api("/portal/api/register", {
    method: "POST",
    body: {
      name: $("register-name").value,
      password: $("register-pass").value,
      email: $("register-email").value,
      code: $("register-code").value,
    },
  }).then(function (r) {
    if (r.ok) { return r.json(); }
    if (r.status === 403) { throw new Error("管理员已关闭注册"); }
    if (r.status === 503) { throw new Error("管理员还没有配置邮件服务器"); }

    // 服务端的校验消息（密码太短、邮箱已注册等）比通用文案有用得多。
    return r.json().catch(function () { return {}; }).then(function (d) {
      throw new Error(d.error || ("注册失败（HTTP " + r.status + "）"));
    });
  }).then(function (d) {
    $("register-pass").value = "";
    $("register-code").value = "";
    showPanel();
    renderUser(d.user);
    renderAccount(d.user);
    return loadLog(true);
  }).catch(function (err) {
    showAlert($("register-alert"), err.message);
  }).finally(function () {
    btn.disabled = false;
  });
});

/* ---------- 账号设置 ---------- */

function renderAccount(u) {
  if (!u) { return; }

  var email = u.email || "";
  $("email-state").textContent = email
    ? (email + (u.email_verified ? "（已验证）" : "（未验证）"))
    : "未绑定";

  // 已经绑定的地址填进去，省得用户再打一遍。
  if (email && !$("email-input").value) { $("email-input").value = email; }

  $("email-clear-btn").classList.toggle("hidden", !email);
}

codeButton($("email-code-btn"),
  function () { return $("email-input").value; }, $("email-hint"));

$("email-bind-btn").addEventListener("click", function () {
  var email = $("email-input").value.trim();
  if (!email) {
    showAlert($("email-hint"), "请先填邮箱");
    return;
  }

  $("email-bind-btn").disabled = true;
  showAlert($("email-hint"), "");

  api("/portal/api/email", {
    method: "POST",
    body: { email: email, code: $("email-code").value },
  }).then(function (r) {
    if (r.ok) { return r.json(); }
    if (r.status === 503) { throw new Error("管理员还没有配置邮件服务器"); }

    return r.json().catch(function () { return {}; }).then(function (d) {
      throw new Error(d.error || ("绑定失败（HTTP " + r.status + "）"));
    });
  }).then(function (d) {
    $("email-code").value = "";
    showAlert($("email-hint"), "已绑定");
    renderAccount(d.user);
  }).catch(function (err) {
    showAlert($("email-hint"), err.message);
  }).finally(function () {
    $("email-bind-btn").disabled = false;
  });
});

$("email-clear-btn").addEventListener("click", function () {
  showAlert($("email-hint"), "");

  api("/portal/api/email", { method: "POST", body: { email: "" } })
    .then(function (r) {
      if (!r.ok) { throw new Error("解绑失败（HTTP " + r.status + "）"); }
      return r.json();
    }).then(function (d) {
      $("email-input").value = "";
      $("email-code").value = "";
      showAlert($("email-hint"), "已解绑");
      renderAccount(d.user);
    }).catch(function (err) {
      showAlert($("email-hint"), err.message);
    });
});

$("pass-btn").addEventListener("click", function () {
  $("pass-btn").disabled = true;
  showAlert($("pass-hint"), "");

  api("/portal/api/password", {
    method: "POST",
    body: { old_password: $("pass-old").value, new_password: $("pass-new").value },
  }).then(function (r) {
    if (r.ok) { return null; }
    if (r.status === 401) { throw new Error("当前密码不对"); }

    return r.json().catch(function () { return {}; }).then(function (d) {
      throw new Error(d.error || ("修改失败（HTTP " + r.status + "）"));
    });
  }).then(function () {
    $("pass-old").value = "";
    $("pass-new").value = "";
    showAlert($("pass-hint"), "密码已修改");
  }).catch(function (err) {
    showAlert($("pass-hint"), err.message);
  }).finally(function () {
    $("pass-btn").disabled = false;
  });
});

/* ---------- 启动 ---------- */

// 先拉配置再拉会话：注册入口和公告跟着配置走，但配置失败也不能挡住登录。
loadConfig().then(function () {
  return api("/portal/api/me").then(function (r) {
    if (!r.ok) { return null; }
    return r.json();
  }).then(function (d) {
    if (d && d.user) {
      showPanel();
      renderUser(d.user);
      renderAccount(d.user);
      loadLog(true);
    } else {
      showLogin("");
    }
  });
}).catch(function () {
  showLogin("");
});
</script>
