<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- Inline so that a portal on a listener of its own never asks the origin for
     a favicon it does not serve. -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="%232f6feb"/><path d="M9.5 16.5l4.5 4.5 8.5-10" fill="none" stroke="%23fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>我的 DNS 账号</title>
<style>
/* 版式参照 NextDNS：不用卡片堆叠，改用细分隔线组织区块，区块之间留白充足，
   技术性取值一律等宽字体并配复制按钮。 */
:root {
  --bg: #ffffff; --panel: #fafafa; --fg: #16181d; --muted: #6b7280;
  --line: #e8e8ec; --line-soft: #f1f1f4; --accent: #2563eb; --accent-fg: #fff;
  --bad: #d1242f; --good: #16a34a; --warn: #b45309; --track: #e4e7ec;
  --code-bg: #f7f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0f12; --panel: #15161a; --fg: #e8eaee; --muted: #9aa1ad;
    --line: #26282e; --line-soft: #1c1e23; --accent: #4c8dff; --accent-fg: #0b0d11;
    --bad: #f85149; --good: #3fb950; --warn: #d29922; --track: #2b2f37;
    --code-bg: #17181c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); min-height: 100vh;
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 860px; margin: 0 auto;
  padding: 20px calc(18px + env(safe-area-inset-right))
           calc(64px + env(safe-area-inset-bottom))
           calc(18px + env(safe-area-inset-left));
}
/* .row 是一行内联控件；按钮不能被 flex 拉伸，否则会出现"大方块里一个小字"。 */
.row { display: flex; align-items: center; gap: 8px; }
.row > button { flex: 0 0 auto; }
.row > input { flex: 1 1 auto; min-width: 0; }
/* 输入框和按钮并排时高度必须一样，否则右边缘参差。输入框的高度由字体和
   内边距决定，所以让按钮撑满整行，而不是各自写死一个高度。 */
.ctrl-row > button { align-self: stretch; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.hidden { display: none !important; }
.center { text-align: center; }

/* ---------- 页头 ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -.01em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
        flex: 0 0 auto; display: grid; place-items: center; color: var(--accent-fg);
        font-size: 14px; font-weight: 700; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
       flex: 0 0 auto; }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }

/* ---------- 区块 ---------- */
.sect { padding: 30px 0; border-bottom: 1px solid var(--line-soft); }
.sect:last-child { border-bottom: 0; }
.sect-head { margin-bottom: 16px; }
.sect-head h2 { font-size: 16px; margin: 0 0 3px; font-weight: 600;
                letter-spacing: -.005em; }
.sect-head p { margin: 0; font-size: 13px; color: var(--muted); }

/* ---------- 键值行 ---------- */
.kv { display: flex; align-items: center; gap: 16px; padding: 11px 0;
      border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.kv:first-of-type { border-top: 0; }
.kv > .k { flex: 0 0 132px; font-size: 13px; color: var(--muted); }
.kv > .v { flex: 1 1 220px; min-width: 0; }

/* ---------- 等宽取值框 ---------- */
.endpoint {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 8px 9px 11px;
}
/* 换行而不是省略号：地址被截断的话，用户没法确认自己复制了什么。 */
.endpoint code {
  flex: 1 1 auto; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo,
  Consolas, monospace; font-size: 12.5px; overflow-wrap: break-word;
}
.endpoint.copied { border-color: var(--good); }
.endpoint.copied code { color: var(--good); }
.copy {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg);
  color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer;
  font-size: 12px; min-height: 0; line-height: 1.3;
}
.copy:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 表单 ---------- */
button {
  font: inherit; border: 1px solid var(--line); background: var(--bg);
  color: var(--fg); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  min-height: 38px; font-size: 14px; white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent);
                 color: var(--accent-fg); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.quiet { border-color: transparent; color: var(--muted); }
button.quiet:hover { border-color: var(--line); color: var(--fg); }
button:disabled { opacity: .5; cursor: default; }
button.wide { width: 100%; }
button.small { font-size: 13px; padding: 7px 12px; min-height: 36px; }
input, textarea {
  font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  min-height: 40px;
}
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px;
                              border-color: transparent; }
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 13px; color: var(--muted);
                 margin-bottom: 6px; }

/* ---------- 用量 ---------- */
.usage-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.usage-num { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
.bar { height: 6px; border-radius: 3px; background: var(--track);
       overflow: hidden; margin: 12px 0 8px; }
.bar > i { display: block; height: 100%; background: var(--accent);
           border-radius: 3px; transition: width .3s; }
.bar.over > i { background: var(--bad); }
.pill { padding: 2px 9px; border-radius: 999px; font-size: 12px;
        border: 1px solid var(--line); color: var(--muted); }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

/* ---------- 图表 ---------- */
/* 固定 30 个槽位，缺失的日子画成空槽；柱子有宽度上限，所以只有一天数据时也能
   看出它在时间轴上的位置，而不是一根占满宽度的色块。 */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 52px;
         padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.spark > span { flex: 1 1 0; max-width: 18px; height: 100%; border-radius: 3px;
                background: var(--track); opacity: .55; display: flex;
                align-items: flex-end; overflow: hidden; }
.spark > span > i { display: block; width: 100%; height: 0; background: var(--accent);
                    border-radius: 3px; }
/* 描边画在盒内，否则最右边那根（就是"今天"）会贴到容器边界被裁掉。 */
.spark > span.today { outline: 1px solid var(--accent); outline-offset: -1px; }
.axis { display: flex; justify-content: space-between; margin-top: 6px;
        font-size: 11px; color: var(--muted); }

/* ---------- 日志 ---------- */
/* flex 行而不是 table：table-layout:auto 会让 text-overflow: ellipsis 失效，
   超长域名会被硬切掉。 */
.spinner { display: inline-block; width: 13px; height: 13px; margin-right: 8px;
           border: 2px solid var(--track); border-top-color: var(--accent);
           border-radius: 50%; vertical-align: -2px;
           animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.logrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;
          border-top: 1px solid var(--line-soft); }
.logrow:first-child { border-top: 0; }
.logrow > .pill { flex: 0 0 auto; margin-top: 1px; }
.logmain { flex: 1 1 auto; min-width: 0; }
.logmain .host { font-size: 14px; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
.logmain .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.metarow { display: flex; flex-wrap: wrap; row-gap: 2px; }
.metarow > span { white-space: nowrap; }
/* 分隔符由 CSS 前缀生成并跟随它后面的那一项，换行时不会在行尾留下孤立的"·"。 */
.metarow > span + span::before { content: " · "; }

/* ---------- 提示 ---------- */
.alert { border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px;
         display: none; }
.alert.show { display: block; }
.alert.err { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.alert.ok { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }
.notice { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px;
          margin: 22px 0 0; }
.notice h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.notice p { margin: 0; font-size: 13px; white-space: pre-wrap; color: var(--fg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- 窄屏 ---------- */
@media (max-width: 560px) {
  .sect { padding: 26px 0; }
  .kv { gap: 4px; }
  .kv > .k { flex: 0 0 100%; }
  .kv > .v { flex: 1 1 100%; }
  .endpoint code { font-size: 11.5px; }
  .usage-num { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <section id="login-view">
    <div class="topbar" style="border-bottom:0;padding-bottom:0;margin-bottom:22px">
      <div class="brand">
        <div class="mark">A</div>
        <h1>我的 DNS 账号</h1>
      </div>
    </div>

    <div style="max-width:400px">
      <div id="login-alert" class="alert err"></div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-name">标识或邮箱</label>
          <input id="login-name" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="login-pass">密码</label>
          <input id="login-pass" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button id="login-btn" class="primary wide" type="submit">登录</button>
      </form>

      <p class="tiny muted hidden" id="login-register" style="margin:16px 0 0">
        还没有账号？<a href="#" id="login-register-link">立即注册</a>
      </p>
      <p class="tiny muted" id="login-hint" style="margin:14px 0 0"></p>
    </div>
  </section>

  <!-- 注册 -->
  <section id="register-view" class="hidden">
    <div class="topbar" style="border-bottom:0;padding-bottom:0;margin-bottom:22px">
      <div class="brand">
        <div class="mark">A</div>
        <h1>注册账号</h1>
      </div>
    </div>

    <div style="max-width:440px">
      <div id="register-alert" class="alert err"></div>
      <form id="register-form" autocomplete="on">
        <div class="field">
          <label for="register-name">用户名</label>
          <input id="register-name" name="name" autocomplete="nickname" required>
        </div>

        <div class="field">
          <label for="register-email">邮箱</label>
          <div class="row ctrl-row" style="gap:8px;flex-wrap:nowrap">
            <input id="register-email" name="email" type="email" autocomplete="email"
                   placeholder="you@example.com" required style="flex:1">
            <button id="register-code-btn" class="small hidden" type="button">发验证码</button>
          </div>
        </div>

        <div class="field hidden" id="register-code-block">
          <label for="register-code">邮箱验证码</label>
          <input id="register-code" name="code" inputmode="numeric"
                 autocomplete="one-time-code" placeholder="6 位数字">
        </div>

        <div class="field">
          <label for="register-pass">密码</label>
          <input id="register-pass" name="password" type="password"
                 autocomplete="new-password" placeholder="至少 8 位" required>
        </div>

        <button id="register-btn" class="primary wide" type="submit">注册</button>
      </form>

      <p class="tiny muted" style="margin:16px 0 0">
        注册后系统会分配一个专属标识，它就是你的 DoT / DoH 域名前缀，<b>不可更改</b>。
      </p>
      <p class="tiny muted" style="margin:10px 0 0">
        <a href="#" id="register-back">返回登录</a>
      </p>
    </div>
  </section>

  <!-- 面板 -->
  <section id="panel-view" class="hidden">
    <div class="topbar">
      <div class="brand">
        <div class="mark">A</div>
        <div style="min-width:0">
          <h1 id="account-name">—</h1>
          <div class="tiny muted mono" id="account-id">—</div>
        </div>
      </div>
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <span class="pill" id="status-pill">—</span>
        <button id="logout-btn" class="quiet small">退出</button>
      </div>
    </div>

    <div id="panel-alert" class="alert err"></div>

    <div id="announcement" class="notice hidden">
      <h3>公告</h3>
      <p id="announcement-text"></p>
    </div>

    <section class="sect">
      <div class="sect-head">
        <h2>用量</h2>
        <p id="usage-desc">当前计费周期内已经解析的查询次数。</p>
      </div>
      <div class="usage-line">
        <span class="usage-num mono" id="usage-num">—</span>
        <span class="small muted" id="usage-sub"></span>
      </div>
      <div class="bar" id="usage-bar"><i style="width:0"></i></div>
      <div class="kv" id="row-reset">
        <div class="k">下次重置</div>
        <div class="v mono small" id="usage-reset">—</div>
      </div>
      <div class="kv" id="row-expire">
        <div class="k">到期时间</div>
        <div class="v mono small" id="usage-expire">—</div>
      </div>
      <div class="kv">
        <div class="k">有效期剩余</div>
        <div class="v" id="usage-left">—</div>
      </div>
    </section>

    <section class="sect">
      <div class="sect-head">
        <h2>接入配置</h2>
        <p>把下面的地址填进设备或路由器，就可以开始使用。</p>
      </div>
      <div id="endpoints"></div>
      <p class="tiny muted" id="hosts-hint" style="margin:12px 0 0"></p>
    </section>

    <section class="sect" id="history-card">
      <div class="sect-head">
        <h2>最近 30 天</h2>
        <p id="history-hint">每天的查询次数。</p>
      </div>
      <div class="spark" id="spark"></div>
      <div class="axis"><span id="axis-start"></span><span id="axis-peak"></span><span id="axis-end"></span></div>
    </section>

    <section class="sect">
      <div class="sect-head">
        <h2>查询日志</h2>
        <p>最近经过本服务的解析记录。</p>
      </div>
      <div class="row ctrl-row" style="margin-bottom:12px;flex-wrap:nowrap">
        <input id="log-term" placeholder="按域名筛选，留空看全部" style="flex:1">
        <button id="log-refresh" class="small">刷新</button>
      </div>
      <div id="log-body"><p class="small muted" style="margin:0"><span class="spinner"></span>正在加载查询日志…</p></div>
      <div class="row" style="margin-top:12px">
        <button id="log-more" class="wide small hidden">加载更多</button>
      </div>
    </section>

    <section class="sect">
      <div class="sect-head">
        <h2>账号设置</h2>
        <p>邮箱用来接收验证码；标识由系统分配，不可更改。</p>
      </div>

      <div class="kv">
        <div class="k">邮箱</div>
        <div class="v">
          <div class="row ctrl-row" style="gap:8px;flex-wrap:nowrap">
            <input id="email-input" type="email" placeholder="you@example.com" style="flex:1">
            <button id="email-code-btn" class="small" type="button">发验证码</button>
          </div>
          <div class="row ctrl-row" style="gap:8px;margin-top:8px;flex-wrap:nowrap">
            <input id="email-code" inputmode="numeric" placeholder="验证码" style="flex:1">
            <button id="email-bind-btn" class="small primary" type="button">绑定</button>
            <button id="email-clear-btn" class="small hidden" type="button">解绑</button>
          </div>
          <p class="tiny muted" id="email-hint" style="margin:8px 0 0"></p>
        </div>
      </div>

      <div class="kv">
        <div class="k">修改密码</div>
        <div class="v">
          <input id="pass-old" type="password" autocomplete="current-password"
                 placeholder="当前密码">
          <input id="pass-new" type="password" autocomplete="new-password"
                 placeholder="新密码（至少 8 位）" style="margin-top:8px">
          <div class="row" style="margin-top:10px">
            <button id="pass-btn" class="small" type="button">修改密码</button>
          </div>
          <p class="tiny muted" id="pass-hint" style="margin:8px 0 0"></p>
        </div>
      </div>
    </section>
  </section>

</div>

<!-- config.js 由管理端的「门户部署」生成，里面的 apiBase 指向 API 的地址；
     自带页面里它是空值，表示与页面同源。 -->
<script src="config.js"></script>

<script>
"use strict";

// API_BASE 留空表示与页面同源。独立部署（前端在国外、API 在国内）时由
// config.js 提供国内 API 的地址，例如 "https://dns.example.com:3004"。
// 同时必须把该页面的来源加进管理端设置里的「门户来源」，否则浏览器会拦下
// 跨域请求。
var API_BASE = (window.AGHUB_PORTAL_CONFIG && window.AGHUB_PORTAL_CONFIG.apiBase) || "";

// 地址末尾的斜杠会让拼接出的路径变成 "//portal/api/…"，服务端会 404。
if (API_BASE.slice(-1) === "/") {
  API_BASE = API_BASE.slice(0, -1);
}

var PAGE_SIZE = 100;
var MAX_KEPT = 1000;

var $ = function (id) { return document.getElementById(id); };

function api(path, opts) {
  opts = opts || {};
  return fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "include",
    cache: "no-store",
  });
}

function showAlert(el, msg) {
  el.textContent = msg || "";
  el.classList.toggle("show", !!msg);
}

function fmtDate(sec) {
  if (!sec) { return "—"; }
  var d = new Date(sec * 1000);
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function fmtLeft(sec) {
  if (sec == null || sec < 0) { return "永久"; }
  if (sec === 0) { return "已到期"; }
  var d = Math.floor(sec / 86400);
  if (d >= 1) { return d + " 天"; }
  var h = Math.floor(sec / 3600);
  if (h >= 1) { return h + " 小时"; }
  return Math.max(1, Math.floor(sec / 60)) + " 分钟";
}

var STATUS = {
  active: ["正常", "ok"],
  disabled: ["已停用", "bad"],
  expired: ["已到期", "bad"],
  over_quota: ["已超额", "bad"],
  expiring_soon: ["即将到期", "warn"],
};

/* ---------- 登录 ---------- */

function showLogin(msg) {
  $("panel-view").classList.add("hidden");
  $("register-view").classList.add("hidden");
  $("login-view").classList.remove("hidden");
  showAlert($("login-alert"), msg);
}

function showPanel() {
  $("login-view").classList.add("hidden");
  $("register-view").classList.add("hidden");
  $("panel-view").classList.remove("hidden");
}

function showRegister() {
  $("login-view").classList.add("hidden");
  $("panel-view").classList.add("hidden");
  $("register-view").classList.remove("hidden");
  showAlert($("register-alert"), "");
}

$("login-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var btn = $("login-btn");
  btn.disabled = true;
  showAlert($("login-alert"), "");

  api("/portal/api/login", {
    method: "POST",
    body: { login: $("login-name").value, password: $("login-pass").value },
  }).then(function (r) {
    if (r.ok) { return r.json(); }
    if (r.status === 401) { throw new Error("标识或密码不对"); }
    if (r.status === 429) { throw new Error("尝试太频繁，请过一会儿再试"); }
    throw new Error("登录失败（HTTP " + r.status + "）");
  }).then(function (d) {
    $("login-pass").value = "";
    showPanel();
    renderUser(d.user);
    return loadLog(true);
  }).catch(function (err) {
    showAlert($("login-alert"), err.message);
  }).finally(function () {
    btn.disabled = false;
  });
});

$("logout-btn").addEventListener("click", function () {
  api("/portal/api/logout", { method: "POST" }).finally(function () {
    log = [];
    showLogin("已退出");
  });
});

/* ---------- 账号 ---------- */

function renderUser(u) {
  if (!u) { return; }

  $("account-name").textContent = u.name || u.uid;
  $("account-id").textContent = u.uid;

  var st = STATUS[u.status] || [u.status || "未知", ""];
  var pill = $("status-pill");
  pill.textContent = st[0];
  pill.className = st[1] ? "pill " + st[1] : "pill";

  renderEndpoints(u);
  renderUsage(u);
  renderHistory(u.history, u);
}

/* ---------- 接入配置 ---------- */

// endpointRow 生成一行「标签 + 等宽取值 + 复制」，取值本身就是可点的复制按钮。
function endpointRow(label, value, note) {
  var row = document.createElement("div");
  row.className = "kv";

  var k = document.createElement("div");
  k.className = "k";
  k.textContent = label;
  row.appendChild(k);

  var v = document.createElement("div");
  v.className = "v";

  var box = document.createElement("div");
  box.className = "endpoint";

  var code = document.createElement("code");
  // 先 textContent 再读回 innerHTML，等于转义一次，然后才插 <wbr>。
  // 断点放在每个 "/" 之后：地址换行时断在路径分隔符处，而不是把
  // "lv10.ren" 从中间劈成两半。<wbr> 不影响 textContent，复制仍是完整值。
  code.textContent = value;
  code.innerHTML = code.innerHTML.split("/").join("/<wbr>");
  box.appendChild(code);

  var btn = document.createElement("button");
  btn.className = "copy";
  btn.type = "button";
  btn.textContent = "复制";
  btn.addEventListener("click", function () { copy(value, box); });
  box.appendChild(btn);

  v.appendChild(box);

  if (note) {
    var n = document.createElement("p");
    n.className = "tiny muted";
    n.style.margin = "6px 0 0";
    n.textContent = note;
    v.appendChild(n);
  }

  row.appendChild(v);

  return row;
}

function renderEndpoints(u) {
  var box = $("endpoints");
  box.textContent = "";

  var list = u.hosts || [];
  if (list.length === 0) {
    var p = document.createElement("p");
    p.className = "small muted";
    p.style.margin = "0";
    p.textContent = "你的账号是按来源地址识别的，直接用管理员给你的 DNS 地址即可，"
      + "不需要在客户端里填写主机名。";
    box.appendChild(p);
    $("hosts-hint").textContent = "";

    return;
  }

  list.forEach(function (h) {
    box.appendChild(endpointRow("DoT", h, "在客户端里填这个主机名，端口 853。"));
    box.appendChild(endpointRow("DoH", "https://" + h + "/dns-query",
      "直接把这个地址粘进支持 DoH 的浏览器或系统设置里。"));
  });

  $("hosts-hint").textContent = "";
}

/* ---------- 用量 ---------- */

function renderUsage(u) {
  var used = u.requests || 0;
  var limit = u.request_limit;
  var unlimited = !limit || limit < 0;

  $("usage-num").textContent = used.toLocaleString();
  $("usage-sub").textContent = unlimited
    ? "次（不限量）"
    : " / " + limit.toLocaleString() + " 次";

  var bar = $("usage-bar");
  var fill = bar.querySelector("i");
  var pct = unlimited ? 0 : Math.min(100, used / limit * 100);
  // 大配额下 0.02% 会被算成 0px，看起来和分隔线没区别 —— 只要有用量就至少
  // 给 2px，让"有没有在用"这件事一眼看得出来。
  if (unlimited) {
    fill.style.width = "100%";
  } else if (used > 0) {
    fill.style.width = "max(2px, " + pct.toFixed(2) + "%)";
  } else {
    fill.style.width = "0";
  }
  bar.classList.toggle("over", !unlimited && used >= limit);

  $("usage-desc").textContent = u.period === "total"
    ? "自开通以来累计解析的查询次数。"
    : "当前计费周期内已经解析的查询次数，"
      + (u.period === "day" ? "每天" : u.period === "month" ? "每月" : "每周")
      + "重置一次。";

  // 一行一个字段，不再用"·"把三个信息挤成一串 —— 窄屏换行时行首会掉下一个
  // 孤立的"·"。没有值的行整行藏掉，而不是留一个"—"。
  setRow("row-reset", "usage-reset", u.next_reset ? fmtDate(u.next_reset) : "");
  setRow("row-expire", "usage-expire", u.expires_at ? fmtDate(u.expires_at) : "");

  var left = fmtLeft(u.remaining_seconds);
  $("usage-left").textContent = left || "—";
  $("usage-left").className = "v";
  if (left && u.remaining_seconds > 0 && u.remaining_seconds < 3 * 86400) {
    $("usage-left").className = "v pill warn";
    $("usage-left").style.display = "inline-block";
  }
}

// setRow 填一行键值，值为空时把整行藏起来。
function setRow(rowID, valueID, value) {
  var row = $(rowID);
  if (!row) { return; }

  row.classList.toggle("hidden", !value);
  $(valueID).textContent = value || "—";
}

function copy(text, el) {
  var done = function () {
    el.classList.add("copied");
    var t = el.querySelector(".tiny");
    if (t) { t.textContent = "已复制"; }
    setTimeout(function () {
      el.classList.remove("copied");
      if (t) { t.textContent = "复制"; }
    }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  } else {
    fallback();
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  }
}

var HISTORY_DAYS = 30;

function fmtDay(d) {
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

// 固定画出 30 个槽位，缺失的日子留空槽。服务端只在有活动之后才开始记历史，
// 所以新用户一开始只有一天数据；如果按"有几天画几根"，一天就会被拉成一整块
// 色块，看不出任何时间位置。
function renderHistory(history, u) {
  var spark = $("spark");
  spark.textContent = "";
  history = history || [];

  var byDate = {};
  history.forEach(function (p) { byDate[p.date] = p.requests; });

  // 以服务端给的最后一天为锚点，避免浏览器时区与服务端不一致。
  var last = history.length
    ? history[history.length - 1].date
    : fmtDay(new Date());
  var parts = last.split("-");
  var end = new Date(+parts[0], +parts[1] - 1, +parts[2]);

  // 纵轴按历史峰值缩放，并在轴上标出满格代表多少次。若按日配额满格，配额
  // 五万而实际用量两位数时所有柱子都是 0 高，图表就什么也没说。峰值的副作用
  // 是"只有一天数据时那天必然满格"，所以满格值必须标出来，免得被读成配额用尽。
  var max = 1;
  history.forEach(function (p) { if (p.requests > max) { max = p.requests; } });

  for (var i = HISTORY_DAYS - 1; i >= 0; i--) {
    var d = new Date(end.getFullYear(), end.getMonth(), end.getDate() - i);
    var date = fmtDay(d);
    var n = byDate[date];
    var b = document.createElement("span");
    var fill = document.createElement("i");
    if (n === undefined) {
      b.title = date + "：无记录";
    } else {
      // 填充占整格高度的比例，最少 8% 以免少量用量看不见。
      fill.style.height = Math.max(6, Math.round(n / max * 100)) + "%";
      b.title = date + "：" + n + " 次";
    }
    if (i === 0) { b.className = "today"; }
    b.appendChild(fill);
    spark.appendChild(b);
  }

  var startDate = new Date(end.getFullYear(), end.getMonth(),
    end.getDate() - (HISTORY_DAYS - 1));
  $("axis-start").textContent = fmtDay(startDate).slice(5);
  $("axis-end").textContent = fmtDay(end).slice(5) + " 今天";

  // 柱高是按 max 满格的，不标出来就没人知道一格代表多少。
  $("axis-peak").textContent = history.length
    ? "满格 " + max.toLocaleString() + " 次"
    : "";

  var total = 0;
  history.forEach(function (p) { total += p.requests; });

  if (history.length === 0) {
    $("history-hint").textContent =
      "还没有用量记录，有查询之后这里会显示最近 30 天的趋势。";
  } else if (history.length === 1) {
    $("history-hint").textContent =
      history[0].date + "，共 " + total.toLocaleString() +
      " 次请求（只有一天数据）。";
  } else {
    $("history-hint").textContent =
      history[0].date + " 至 " + last + "，共 " +
      total.toLocaleString() + " 次请求。";
  }
}

/* ---------- 查询日志 ---------- */

var log = [];
var exhausted = false;
var loading = false;

function entryHost(e) {
  var q = e.question || {};
  return q.unicode_name || q.name || "";
}

function entryStatus(e) {
  // 接口给的是 filtering.Reason 的字符串形式，例如 FilteredBlockList、
  // Rewritten、NotFilteredNotFound。
  var r = e.reason || "";
  if (r === "Rewritten") { return ["warn", "改写"]; }
  if (r.indexOf("Filtered") === 0) { return ["bad", "拦截"]; }
  return ["", "通过"];
}

function renderLog() {
  var body = $("log-body");
  if (log.length === 0) {
    body.innerHTML = '<p class="small muted">没有记录。</p>';
    $("log-more").classList.add("hidden");
    return;
  }
  var frag = document.createDocumentFragment();
  log.forEach(function (e) {
    var st = entryStatus(e);
    var row = document.createElement("div");
    row.className = "logrow";

    var badge = document.createElement("span");
    badge.className = "badge " + st[0];
    badge.textContent = st[1];

    var main = document.createElement("div");
    main.className = "logmain";

    var host = document.createElement("div");
    host.className = "host";
    host.textContent = entryHost(e) || "—";
    host.title = host.textContent;

    var meta = document.createElement("div");
    meta.className = "meta";
    var parts = [];
    if (e.question && e.question.type) { parts.push(e.question.type); }
    if (e.time) { parts.push(fmtDate(Date.parse(e.time) / 1000)); }
    if (e.client) { parts.push(e.client); }
    meta.textContent = parts.join(" · ");

    main.appendChild(host);
    main.appendChild(meta);
    row.appendChild(badge);
    row.appendChild(main);
    frag.appendChild(row);
  });
  body.textContent = "";
  body.appendChild(frag);
  $("log-more").classList.toggle("hidden", exhausted || log.length >= MAX_KEPT);
}

function loadLog(reset) {
  if (loading) { return Promise.resolve(); }
  loading = true;
  var more = $("log-more");
  more.disabled = true;

  var term = $("log-term").value.trim();
  var path = "/portal/api/log?limit=" + PAGE_SIZE;
  if (term) { path += "&term=" + encodeURIComponent(term); }
  if (!reset && log.length > 0) {
    // 用最后一条的时间做游标，避免重复。
    var last = log[log.length - 1];
    if (last && last.time) {
      path += "&older_than=" + encodeURIComponent(last.time);
    }
  }

  return api(path).then(function (r) {
    if (r.status === 401) {
      throw new Error("登录已失效，请重新登录");
    }
    if (!r.ok) { throw new Error("加载失败（HTTP " + r.status + "）"); }
    return r.json();
  }).then(function (d) {
    var data = (d && d.data) || [];
    if (reset) { log = []; }
    log = log.concat(data);
    if (log.length > MAX_KEPT) { log = log.slice(0, MAX_KEPT); }
    exhausted = data.length < PAGE_SIZE;
    renderLog();
    showAlert($("panel-alert"), "");
  }).catch(function (err) {
    showAlert($("panel-alert"), err.message);
    if (/登录已失效/.test(err.message)) { showLogin(err.message); }
  }).finally(function () {
    loading = false;
    more.disabled = false;
  });
}

$("log-refresh").addEventListener("click", function () {
  exhausted = false;
  loadLog(true);
});
$("log-more").addEventListener("click", function () { loadLog(false); });
$("log-term").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { exhausted = false; loadLog(true); }
});

/* ---------- 注册与账号设置 ---------- */

// 由 /portal/api/config 填充：注册开关、是否要邮箱验证、公告。
var PORTAL_CONFIG = {
  registration_open: false,
  email_required: false,
  announcement: "",
};

function loadConfig() {
  return api("/portal/api/config").then(function (r) {
    if (!r.ok) { return null; }
    return r.json();
  }).then(function (d) {
    if (d) { PORTAL_CONFIG = d; }

    $("login-register").classList.toggle("hidden", !PORTAL_CONFIG.registration_open);

    // 用户名和邮箱永远要填；只有开启邮箱验证时才多一个验证码。
    var needsCode = !!PORTAL_CONFIG.email_required;
    $("register-code-block").classList.toggle("hidden", !needsCode);
    $("register-code-btn").classList.toggle("hidden", !needsCode);
    $("register-code").required = needsCode;

    var text = PORTAL_CONFIG.announcement || "";
    $("announcement-text").textContent = text;
    $("announcement").classList.toggle("hidden", !text);
  }).catch(function () {
    // 配置拉不到不该挡住登录，按最保守的默认值继续。
  });
}

/* ---------- 注册 ---------- */

$("login-register-link").addEventListener("click", function (e) {
  e.preventDefault();
  showRegister();
});

$("register-back").addEventListener("click", function (e) {
  e.preventDefault();
  showLogin("");
});

// 验证码按钮：发送成功后进入倒计时，免得连点把服务器当发信机用。
function codeButton(btn, getEmail, alertEl) {
  var left = 0;
  var timer = null;
  var label = btn.textContent;

  var tick = function () {
    if (left <= 0) {
      clearInterval(timer);
      timer = null;
      btn.disabled = false;
      btn.textContent = label;
      return;
    }

    btn.textContent = left + " 秒后可重发";
    left -= 1;
  };

  btn.addEventListener("click", function () {
    var email = (getEmail() || "").trim();
    if (!email) {
      showAlert(alertEl, "请先填邮箱");
      return;
    }

    btn.disabled = true;
    showAlert(alertEl, "");

    api("/portal/api/email/code", { method: "POST", body: { email: email } })
      .then(function (r) {
        if (r.ok) { return null; }
        if (r.status === 429) { throw new Error("发送太频繁，请稍后再试"); }
        if (r.status === 503) { throw new Error("管理员还没有配置邮件服务器"); }
        throw new Error("发送失败（HTTP " + r.status + "）");
      })
      .then(function () {
        left = 60;
        tick();
        timer = setInterval(tick, 1000);
      })
      .catch(function (err) {
        showAlert(alertEl, err.message);
        btn.disabled = false;
      });
  });
}

codeButton($("register-code-btn"),
  function () { return $("register-email").value; }, $("register-alert"));

$("register-form").addEventListener("submit", function (e) {
  e.preventDefault();

  var btn = $("register-btn");
  btn.disabled = true;
  showAlert($("register-alert"), "");

  api("/portal/api/register", {
    method: "POST",
    body: {
      name: $("register-name").value,
      password: $("register-pass").value,
      email: $("register-email").value,
      code: $("register-code").value,
    },
  }).then(function (r) {
    if (r.ok) { return r.json(); }
    if (r.status === 403) { throw new Error("管理员已关闭注册"); }
    if (r.status === 503) { throw new Error("管理员还没有配置邮件服务器"); }

    // 服务端的校验消息（密码太短、邮箱已注册等）比通用文案有用得多。
    return r.json().catch(function () { return {}; }).then(function (d) {
      throw new Error(d.error || ("注册失败（HTTP " + r.status + "）"));
    });
  }).then(function (d) {
    $("register-pass").value = "";
    $("register-code").value = "";
    showPanel();
    renderUser(d.user);
    renderAccount(d.user);
    return loadLog(true);
  }).catch(function (err) {
    showAlert($("register-alert"), err.message);
  }).finally(function () {
    btn.disabled = false;
  });
});

/* ---------- 账号设置 ---------- */

function renderAccount(u) {
  if (!u) { return; }

  var email = u.email || "";
  $("email-state").textContent = email
    ? (email + (u.email_verified ? "（已验证）" : "（未验证）"))
    : "未绑定";

  // 已经绑定的地址填进去，省得用户再打一遍。
  if (email && !$("email-input").value) { $("email-input").value = email; }

  $("email-clear-btn").classList.toggle("hidden", !email);
}

codeButton($("email-code-btn"),
  function () { return $("email-input").value; }, $("email-hint"));

$("email-bind-btn").addEventListener("click", function () {
  var email = $("email-input").value.trim();
  if (!email) {
    showAlert($("email-hint"), "请先填邮箱");
    return;
  }

  $("email-bind-btn").disabled = true;
  showAlert($("email-hint"), "");

  api("/portal/api/email", {
    method: "POST",
    body: { email: email, code: $("email-code").value },
  }).then(function (r) {
    if (r.ok) { return r.json(); }
    if (r.status === 503) { throw new Error("管理员还没有配置邮件服务器"); }

    return r.json().catch(function () { return {}; }).then(function (d) {
      throw new Error(d.error || ("绑定失败（HTTP " + r.status + "）"));
    });
  }).then(function (d) {
    $("email-code").value = "";
    showAlert($("email-hint"), "已绑定");
    renderAccount(d.user);
  }).catch(function (err) {
    showAlert($("email-hint"), err.message);
  }).finally(function () {
    $("email-bind-btn").disabled = false;
  });
});

$("email-clear-btn").addEventListener("click", function () {
  showAlert($("email-hint"), "");

  api("/portal/api/email", { method: "POST", body: { email: "" } })
    .then(function (r) {
      if (!r.ok) { throw new Error("解绑失败（HTTP " + r.status + "）"); }
      return r.json();
    }).then(function (d) {
      $("email-input").value = "";
      $("email-code").value = "";
      showAlert($("email-hint"), "已解绑");
      renderAccount(d.user);
    }).catch(function (err) {
      showAlert($("email-hint"), err.message);
    });
});

$("pass-btn").addEventListener("click", function () {
  $("pass-btn").disabled = true;
  showAlert($("pass-hint"), "");

  api("/portal/api/password", {
    method: "POST",
    body: { old_password: $("pass-old").value, new_password: $("pass-new").value },
  }).then(function (r) {
    if (r.ok) { return null; }
    if (r.status === 401) { throw new Error("当前密码不对"); }

    return r.json().catch(function () { return {}; }).then(function (d) {
      throw new Error(d.error || ("修改失败（HTTP " + r.status + "）"));
    });
  }).then(function () {
    $("pass-old").value = "";
    $("pass-new").value = "";
    showAlert($("pass-hint"), "密码已修改");
  }).catch(function (err) {
    showAlert($("pass-hint"), err.message);
  }).finally(function () {
    $("pass-btn").disabled = false;
  });
});

/* ---------- 启动 ---------- */

// 先拉配置再拉会话：注册入口和公告跟着配置走，但配置失败也不能挡住登录。
loadConfig().then(function () {
  return api("/portal/api/me").then(function (r) {
    if (!r.ok) { return null; }
    return r.json();
  }).then(function (d) {
    if (d && d.user) {
      showPanel();
      renderUser(d.user);
      renderAccount(d.user);
      loadLog(true);
    } else {
      showLogin("");
    }
  });
}).catch(function () {
  showLogin("");
});
