<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 内联图标，免得门户监听端口还要去要一个自己并不提供的 favicon。 -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%23F05A28"/><path d="M16 7l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6z" fill="%23fff"/></svg>'>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>我的 DNS 账号</title>

<!-- Tailwind 工具类由 scripts/portal-css.sh 编译后内联在下面的
     <style id="portal-tailwind"> 里。不用 CDN 的原因见那个脚本的注释：
     本页 DOM 全部由 JS 渲染，CDN 版只会处理初始 HTML 里出现的类。 -->

<!--
  配色取自 claw.qt.cool 的实测值：暖白底 + 米白卡片 + 近黑字，边框是带一点暖调的
  极淡发丝线，主色橙、蓝只做链接和次要点缀。阴影只有一层，靠 inset 高光提一点体积，
  不做浮雕。暗色是同一色相压暗，不是另配一套灰。
-->
<style>
:root {
  --bg: #FBF8F3;
  --surface: #FFFDF9;
  --glass: rgba(255, 253, 249, .82);
  --ink: #181713;
  --ink2: #615D56;
  --ink3: #918B82;
  --line: rgba(34, 32, 28, .09);
  --line2: rgba(34, 32, 28, .16);
  --accent: #F05A28;
  --accent2: #2F73FF;
  --good: #24B47E;
  --bad: #D64545;
  --warn: #B7791F;
  --track: rgba(34, 32, 28, .08);
  --shadow: 0 1px 2px rgba(60, 40, 20, .04), 0 8px 24px -12px rgba(60, 40, 20, .14), inset 0 1px 0 rgba(255, 255, 255, .6);
  --shadow-pop: 0 2px 6px rgba(60, 40, 20, .06), 0 24px 48px -20px rgba(60, 40, 20, .22), inset 0 1px 0 rgba(255, 255, 255, .6);
}
.dark {
  --bg: #0C0B0A;
  --surface: #141312;
  --glass: rgba(20, 19, 18, .82);
  --ink: #F6F0E8;
  --ink2: #B6AEA4;
  --ink3: #837B73;
  --line: rgba(255, 244, 232, .10);
  --line2: rgba(255, 244, 232, .16);
  --accent: #FF6A2E;
  --accent2: #6B93FF;
  --good: #34D399;
  --bad: #F87171;
  --warn: #FBBF24;
  --track: rgba(255, 244, 232, .10);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -16px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06);
  --shadow-pop: 0 2px 8px rgba(0, 0, 0, .4), 0 32px 64px -24px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06);
}
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 15px/1.6 Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.slide { transition: transform .22s cubic-bezier(.32, .72, 0, 1); }
.fade { transition: opacity .16s ease; }
.spinner {
  display: inline-block; width: 13px; height: 13px; margin-right: 8px; vertical-align: -2px;
  border: 2px solid var(--track); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .slide, .fade { transition: none; } .spinner { animation-duration: 2.4s; } }
</style>

<script>
"use strict";

/* ============================ 配置与接口 ============================ */

// config.js 由管理端打包时生成，里面两项：
//
//   api   —— AGHub 的地址，浏览器能访问到的那个。留空表示与页面同源。
//   token —— 对接令牌，每次请求带在 X-Portal-Token 头上。
//
// token 不是账号凭据：它只说明「这次调用来自管理员打包的这份前端」，用户仍然用
// 自己的密码登录。用头而不是 cookie，是因为跨来源的 cookie 必须 SameSite=None
// 且必须 Secure，明文 HTTP 下会被浏览器直接丢掉。
var CFG = window.AGHUB_PORTAL_CONFIG || {};
var API_BASE = CFG.api || CFG.apiBase || "";
var PORTAL_TOKEN = CFG.token || "";

// 末尾斜杠会让拼出的路径变成 "//portal/api/…"，服务端会当成另一个路由。
if (API_BASE.slice(-1) === "/") { API_BASE = API_BASE.slice(0, -1); }

var PAGE_SIZE = 100;
var MAX_KEPT = 1000;
var HISTORY_DAYS = 30;

// 会话放 localStorage，请求时带 Authorization 头。
var SESSION_KEY = "aghub_portal_session";
var THEME_KEY = "aghub_portal_theme";

function session() {
  try { return window.localStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; }
}
function setSession(tok) {
  try {
    if (tok) { window.localStorage.setItem(SESSION_KEY, tok); }
    else { window.localStorage.removeItem(SESSION_KEY); }
  } catch (e) { /* 隐私模式下不可写，退回到 cookie 会话 */ }
}

var $ = function (id) { return document.getElementById(id); };

function describeFailure() {
  var pageProto = location.protocol.replace(":", "");
  var apiProto = API_BASE ? API_BASE.split("://")[0] : pageProto;

  if (API_BASE && pageProto === "https" && apiProto === "http") {
    return "接口地址是明文 http，而本页是 https，浏览器会直接拦掉这条请求（混合内容）。"
      + "这是浏览器规则，跟认证方式无关。两种办法：① 把 api 改成 https（AGHub 加 "
      + "--web-tls-cert / --web-tls-key）；② 在站点里把 /portal/ 反代到 AGHub，api 留空走同源。";
  }
  if (!API_BASE) {
    return "页面在请求自己的地址，但那里没有接口。要么在 config.js 里把 api 指向 AGHub，"
      + "要么在站点里把 /portal/ 反代到 AGHub。";
  }
  return "连不上接口 " + API_BASE + "。按顺序排查：① 浏览器直接打开 " + API_BASE
    + "/portal/api/public 看通不通（端口没放行、服务没起都会不通）；② 接口用 https 时证书必须受信任；"
    + "③ config.js 里的 token 得是这一份包里的。具体原因看浏览器控制台。";
}

function showNetAlert(msg) {
  var el = $("net-alert");
  el.textContent = msg;
  el.classList.remove("hidden");
  document.body.style.paddingTop = el.offsetHeight + "px";
}
function clearNetAlert() {
  var el = $("net-alert");
  if (!el.classList.contains("hidden")) {
    el.classList.add("hidden");
    document.body.style.paddingTop = "";
  }
}

function api(path, opts) {
  opts = opts || {};

  var headers = {};
  if (opts.body) { headers["Content-Type"] = "application/json"; }
  if (PORTAL_TOKEN) { headers["X-Portal-Token"] = PORTAL_TOKEN; }
  if (session()) { headers["Authorization"] = "Bearer " + session(); }

  return fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    // 同源部署仍然靠 cookie 会话，所以带上凭据；跨来源时靠 Authorization 头。
    credentials: "include",
    cache: "no-store",
  }).then(function (r) {
    // 请求能到达就说明地址和跨域都通了，撤掉上一次的告警。4xx/5xx 是业务结果，
    // 不是部署问题，同样算「通」。
    clearNetAlert();
    return r;
  }).catch(function (e) {
    showNetAlert(describeFailure());
    throw e;
  });
}

// jget 把「HTTP 状态 + 服务端错误消息」折成一个异常，业务代码只写 try/catch。
// 服务端的校验消息（密码太短、邮箱已注册）比通用文案有用，所以优先用它。
async function jget(path, opts) {
  var r = await api(path, opts);
  var text = await r.text();
  var data = {};
  if (text) {
    try { data = JSON.parse(text); } catch (e) { data = { error: text.slice(0, 160) }; }
  }
  if (!r.ok) {
    var err = new Error(data.error || ("请求失败（HTTP " + r.status + "）"));
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ============================ 小工具 ============================ */

// 接口里的名字、域名都是用户自己填的，拼进 HTML 之前一律转义。
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtNum(n) { return (n || 0).toLocaleString(); }

// 与 PHP 门户的 ms_h() 同口径：没样本写破折号而不是 0，0 读起来像「快得没耗时」。
function msH(ms, samples) {
  var v = Number(ms || 0);
  if (!samples || v <= 0) { return "—"; }
  return (v < 10 ? v.toFixed(1) : Math.round(v)) + " ms";
}

function pad(n) { return (n < 10 ? "0" : "") + n; }

// fmtUnix 收秒；fmtISO 收日志里那种 ISO 串。两个都写成显式函数，因为
// 同一个页面上两种时间格式混用，靠一个函数猜格式迟早出错。
function fmtUnix(sec) {
  if (!sec) { return "—"; }
  var d = new Date(sec * 1000);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
    + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmtISO(s) {
  if (!s) { return "—"; }
  var d = new Date(s);
  if (isNaN(d.getTime())) { return String(s); }
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
    + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmtDay(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function fmtLeft(sec) {
  if (sec == null || sec < 0) { return "永久"; }
  if (sec === 0) { return "已到期"; }
  var d = Math.floor(sec / 86400);
  if (d >= 1) { return d + " 天"; }
  var h = Math.floor(sec / 3600);
  if (h >= 1) { return h + " 小时"; }
  return Math.max(1, Math.floor(sec / 60)) + " 分钟";
}

var STATUS = {
  active: ["正常", "good"],
  disabled: ["已停用", "grey"],
  expired: ["已到期", "bad"],
  over_quota: ["已超额", "bad"],
  expiring_soon: ["即将到期", "warn"],
};
function statusTag(status) {
  var st = STATUS[status] || [status || "未知", "grey"];
  return tag(st[0], st[1]);
}
function tag(text, kind) {
  var color = kind === "good" ? "var(--good)" : kind === "bad" ? "var(--bad)"
    : kind === "warn" ? "var(--warn)" : "var(--ink2)";
  return '<span class="tag" style="background:color-mix(in srgb,' + color + ' 15%,transparent);color:' + color + '">'
    + esc(text) + "</span>";
}

// 与 PHP 门户同源的头像配色：同一 uid 在两边显示同一个色相。
function crc32(str) {
  var c, crc = 0xFFFFFFFF;
  for (var i = 0; i < str.length; i++) {
    c = (crc ^ str.charCodeAt(i)) & 0xFF;
    for (var k = 0; k < 8; k++) { c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; }
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function avatarHTML(avatar, name, uid, size) {
  var seed = uid || name || "";
  var hue = seed ? crc32(seed) % 360 : 210;
  var face = avatar || (name || "?").slice(0, 1) || "?";
  return '<span class="grid shrink-0 place-items-center rounded-full font-medium"'
    + ' style="width:' + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.46)
    + 'px;background:hsl(' + hue + ' 60% 92%);color:hsl(' + hue + ' 55% 32%)">' + esc(face) + "</span>";
}

// 明文 HTTP 下 navigator.clipboard 不存在，所以留一条 execCommand 的老路。
function copyText(text, btn, el) {
  var done = function (ok) {
    if (el) { el.style.color = ok ? "var(--good)" : "var(--bad)"; setTimeout(function () { el.style.color = ""; }, 1400); }
    if (btn) {
      var was = btn.textContent;
      btn.textContent = ok ? "已复制" : "复制失败";
      setTimeout(function () { btn.textContent = was; }, 1400);
    }
    if (!ok) { toast("复制失败，请手动选中复制", "bad"); }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
    return;
  }
  done(fallback());

  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

function toast(msg, kind) {
  var el = document.createElement("div");
  el.className = "glass fade mb-2 rounded-[10px] px-3.5 py-2 text-[13px] shadow-pop";
  if (kind === "bad") { el.style.color = "var(--bad)"; }
  if (kind === "ok") { el.style.color = "var(--good)"; }
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(function () {
    el.style.opacity = "0";
    setTimeout(function () { el.remove(); }, 220);
  }, 2400);
}

/* ============================ 状态 ============================ */

var S = {
  view: "dashboard",
  cfg: { registration_open: false, email_required: false, announcement: "" },
  pub: null,
  me: null,
  checkin: null,
  ranking: { order: "today", entries: [], updated: 0 },
  log: { rows: [], term: "", exhausted: false, busy: false, error: "" },
  rules: undefined, // undefined = 还没问过；null = 服务端没有这个接口
  rulesMax: 200,
};

var NAV = [
  { id: "dashboard", label: "仪表盘", auth: false,
    icon: "M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z" },
  { id: "dns", label: "专属DNS管理", auth: true,
    icon: "M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6z" },
  { id: "checkin", label: "签到", auth: true,
    icon: "M8 2v3M16 2v3M3.5 8.5h17M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2zM9 14l2 2 4-4" },
  { id: "ranking", label: "排行榜", auth: false,
    icon: "M8 21h8M12 17v4M6 4h12v5a6 6 0 01-12 0zM6 6H3.5v1.5A3.5 3.5 0 006 10.4M18 6h2.5v1.5A3.5 3.5 0 0118 10.4" },
  { id: "log", label: "查询日志", auth: true,
    icon: "M4 5h16M4 12h16M4 19h10" },
  { id: "rules", label: "自定义过滤规则", auth: true,
    icon: "M3 5h18l-7 8v6l-4-2v-4z" },
];

var TITLES = {
  dashboard: "仪表盘", dns: "专属DNS管理", checkin: "签到",
  ranking: "排行榜", log: "查询日志", rules: "自定义过滤规则",
};

function navIcon(d) {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="'
    + d + '"/></svg>';
}

/* ============================ 主题 ============================ */

function applyTheme(mode) {
  var dark = mode === "dark"
    || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  try {
    if (mode === "auto") { window.localStorage.removeItem(THEME_KEY); }
    else { window.localStorage.setItem(THEME_KEY, mode); }
  } catch (e) { /* 忽略 */ }
  var label = $("theme-label");
  if (label) {
    label.textContent = mode === "auto" ? "跟随系统" : (mode === "dark" ? "暗色" : "亮色");
  }
}
function themeMode() {
  try { return window.localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; }
}

/* ============================ 外壳 ============================ */

function renderNav() {
  $("nav").innerHTML = NAV.map(function (n) {
    return '<a class="nav-item' + (S.view === n.id ? " on" : "") + '" href="#/' + n.id + '">'
      + navIcon(n.icon) + "<span>" + n.label + "</span>"
      + (n.auth && !S.me ? '<span class="ml-auto text-[11px] dim">需登录</span>' : "")
      + "</a>";
  }).join("");
}

function renderTop() {
  var box = $("top-actions");
  if (S.me) {
    box.innerHTML = '<span class="hidden items-center gap-2 sm:flex">'
      + avatarHTML(S.me.avatar, S.me.name, S.me.uid, 26)
      + '<span class="max-w-[9rem] truncate text-[13px] font-medium">' + esc(S.me.name || S.me.uid) + "</span></span>"
      + '<button class="btn btn-sm" id="logout-btn" type="button">退出</button>';
    $("logout-btn").onclick = logout;
    return;
  }
  box.innerHTML = '<button class="btn btn-sm btn-ghost" id="login-open" type="button">登录</button>'
    + (S.cfg.registration_open ? '<button class="btn btn-sm btn-primary" id="reg-open" type="button">注册</button>' : "");
  $("login-open").onclick = function () { openLogin(""); };
  if ($("reg-open")) { $("reg-open").onclick = openRegister; }
}

function renderSideUser() {
  var el = $("side-user");
  if (!S.me) { el.innerHTML = ""; return; }
  el.innerHTML = '<div class="flex items-center gap-2 rounded-[10px] border border-line px-2.5 py-2">'
    + avatarHTML(S.me.avatar, S.me.name, S.me.uid, 32)
    + '<span class="min-w-0"><span class="block truncate text-[13px] font-medium">' + esc(S.me.name || S.me.uid) + "</span>"
    + '<span class="block truncate text-[11px] dim mono">' + esc(S.me.uid) + "</span></span></div>";
}

function openDrawer() {
  $("sidebar").classList.remove("-translate-x-full");
  $("overlay").classList.remove("pointer-events-none", "opacity-0");
}
function closeDrawer() {
  $("sidebar").classList.add("-translate-x-full");
  $("overlay").classList.add("pointer-events-none", "opacity-0");
}

/* ============================ 弹窗 ============================ */

function closeModal() { $("modal-root").innerHTML = ""; }

function modal(title, bodyHTML) {
  $("modal-root").innerHTML =
    '<div class="fade fixed inset-0 z-50 flex items-end justify-center bg-black/30 opacity-100 sm:items-center sm:p-4" id="modal-bg">'
    + '<div class="glass max-h-[92vh] w-full max-w-md overflow-y-auto rounded-t-[16px] p-5 shadow-pop sm:rounded-card">'
    + '<div class="mb-4 flex items-center justify-between"><h2 class="text-[15px] font-semibold">' + title + "</h2>"
    + '<button class="btn btn-ghost btn-sm" id="modal-x" type="button">关闭</button></div>'
    + '<div id="modal-alert" class="mb-3 hidden rounded-[10px] border px-3 py-2 text-[12.5px] leading-relaxed"></div>'
    + bodyHTML + "</div></div>";
  $("modal-x").onclick = closeModal;
  $("modal-bg").onclick = function (e) { if (e.target === $("modal-bg")) { closeModal(); } };
}

function modalAlert(msg, kind) {
  var el = $("modal-alert");
  if (!el) { return; }
  el.textContent = msg || "";
  el.classList.toggle("hidden", !msg);
  el.style.color = kind === "ok" ? "var(--good)" : "var(--bad)";
  el.style.borderColor = kind === "ok"
    ? "color-mix(in srgb, var(--good) 40%, transparent)"
    : "color-mix(in srgb, var(--bad) 40%, transparent)";
}

function openLogin(msg) {
  modal("登录",
    '<form id="login-form" class="flex flex-col gap-3">'
    + '<div><label class="label" for="li-name">标识或邮箱</label>'
    + '<input class="input" id="li-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>'
    + '<div><label class="label" for="li-pass">密码</label>'
    + '<input class="input" id="li-pass" name="password" type="password" autocomplete="current-password" required></div>'
    + '<button class="btn btn-primary mt-1 w-full" id="li-btn" type="submit">登录</button>'
    + (S.cfg.registration_open
      ? '<p class="text-center text-[12.5px] dim">还没有账号？<a href="#" class="link" id="li-reg">立即注册</a></p>'
      : "")
    + "</form>");
  if (msg) { modalAlert(msg); }
  if ($("li-reg")) {
    $("li-reg").onclick = function (e) { e.preventDefault(); openRegister(); };
  }
  $("login-form").onsubmit = async function (e) {
    e.preventDefault();
    var btn = $("li-btn");
    btn.disabled = true;
    modalAlert("");
    try {
      var d = await jget("/portal/api/login", {
        method: "POST",
        body: { login: $("li-name").value, password: $("li-pass").value },
      });
      if (d.token) { setSession(d.token); }
      S.me = d.user;
      await refreshCheckin();
      $("li-pass").value = "";
      closeModal();
      toast("欢迎回来，" + (S.me.name || ""), "ok");
      await enterView();
      render();
    } catch (err) {
      modalAlert(err.message);
    } finally {
      btn.disabled = false;
    }
  };
}

function openRegister() {
  // 用户名和邮箱永远要填；只有开启邮箱验证时才多一个验证码。
  var needsCode = !!S.cfg.email_required;
  modal("注册账号",
    '<form id="reg-form" class="flex flex-col gap-3">'
    + '<div><label class="label" for="rg-name">用户名</label>'
    + '<input class="input" id="rg-name" name="name" autocomplete="nickname" required></div>'
    + '<div><label class="label" for="rg-email">邮箱</label><div class="flex gap-2">'
    + '<input class="input" id="rg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>'
    + (needsCode ? '<button class="btn shrink-0" id="rg-code-btn" type="button">发验证码</button>' : "")
    + "</div></div>"
    + (needsCode
      ? '<div><label class="label" for="rg-code">邮箱验证码</label>'
        + '<input class="input" id="rg-code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字"></div>'
      : "")
    + '<div><label class="label" for="rg-pass">密码</label>'
    + '<input class="input" id="rg-pass" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required></div>'
    + '<button class="btn btn-primary mt-1 w-full" id="rg-btn" type="submit">注册</button>'
    + '<p class="text-[12px] dim">注册后系统会分配一个专属标识，它就是你的 DoT / DoH 域名前缀，<b class="text-ink">不可更改</b>。</p>'
    + "</form>");

  // 验证码按钮：发送成功后倒计时，免得连点把服务器当发信机用。
  if ($("rg-code-btn")) {
    codeButton($("rg-code-btn"), function () { return $("rg-email").value; });
  }

  $("reg-form").onsubmit = async function (e) {
    e.preventDefault();
    var btn = $("rg-btn");
    btn.disabled = true;
    modalAlert("");
    try {
      var d = await jget("/portal/api/register", {
        method: "POST",
        body: {
          name: $("rg-name").value,
          password: $("rg-pass").value,
          email: $("rg-email").value,
          code: $("rg-code") ? $("rg-code").value : "",
        },
      });
      if (d.token) { setSession(d.token); }
      S.me = d.user;
      await refreshCheckin();
      $("rg-pass").value = "";
      closeModal();
      toast("注册成功，已为你登录", "ok");
      await enterView();
      render();
    } catch (err) {
      modalAlert(err.message);
    } finally {
      btn.disabled = false;
    }
  };
}

function codeButton(btn, getEmail) {
  var left = 0;
  var timer = null;
  var label = btn.textContent;

  var tick = function () {
    if (left <= 0) {
      clearInterval(timer);
      timer = null;
      btn.disabled = false;
      btn.textContent = label;
      return;
    }
    btn.textContent = left + " 秒后可重发";
    left -= 1;
  };

  btn.onclick = async function () {
    var email = (getEmail() || "").trim();
    if (!email) { modalAlert("请先填邮箱"); return; }

    btn.disabled = true;
    modalAlert("");
    try {
      await jget("/portal/api/email/code", { method: "POST", body: { email: email } });
      modalAlert("验证码已发送，10 分钟内有效", "ok");
      left = 60;
      tick();
      timer = setInterval(tick, 1000);
    } catch (err) {
      modalAlert(err.message);
      btn.disabled = false;
    }
  };
}

async function logout() {
  try { await jget("/portal/api/logout", { method: "POST" }); } catch (e) { /* 会话已经失效也无所谓 */ }
  setSession("");
  S.me = null;
  S.checkin = null;
  S.log = { rows: [], term: "", exhausted: false, busy: false, error: "" };
  S.rules = undefined;
  toast("已退出登录");
  if (needsAuth(S.view)) { location.hash = "#/dashboard"; }
  render();
}

function needsAuth(view) {
  return NAV.filter(function (n) { return n.id === view && n.auth; }).length > 0;
}

/* ============================ 数据加载 ============================ */

function loadConfig() {
  return jget("/portal/api/config").then(function (d) {
    if (d) { S.cfg = d; }
  }).catch(function () {
    // 配置拉不到不该挡住登录，按最保守的默认值继续（注册入口不显示）。
  });
}

function loadPublic() {
  return jget("/portal/api/public").then(function (d) { S.pub = d; }).catch(function (e) {
    console.error("公共战报加载失败", e);
    // 统计拉不到不该挡住登录入口。
  });
}

function loadMe() {
  return jget("/portal/api/me").then(function (d) {
    S.me = d.user;
    S.checkin = d.checkin;
  }).catch(function (e) {
    if (e.status === 401) { setSession(""); }
    S.me = null;
    S.checkin = null;
  });
}

async function refreshCheckin() {
  if (!S.me) { return; }
  try { S.checkin = await jget("/portal/api/checkin"); } catch (e) { /* 保持原值 */ }
}

async function loadRanking(order) {
  if (order) { S.ranking.order = order; }
  var d = await jget("/portal/api/ranking?limit=50&order=" + S.ranking.order);
  S.ranking.entries = d.entries || [];
  S.ranking.updated = d.updated || 0;
}

async function loadLog(reset) {
  if (S.log.busy) { return; }
  S.log.busy = true;
  S.log.error = "";
  try {
    var path = "/portal/api/log?limit=" + PAGE_SIZE;
    if (S.log.term) { path += "&term=" + encodeURIComponent(S.log.term); }
    if (!reset && S.log.rows.length > 0) {
      // 用最后一条的时间当游标，翻页时不会重复。
      var last = S.log.rows[S.log.rows.length - 1];
      if (last && last.time) { path += "&older_than=" + encodeURIComponent(last.time); }
    }
    var d = await jget(path);
    var rows = (d && d.data) || [];
    S.log.rows = (reset ? [] : S.log.rows).concat(rows);
    if (S.log.rows.length > MAX_KEPT) { S.log.rows = S.log.rows.slice(0, MAX_KEPT); }
    S.log.exhausted = rows.length < PAGE_SIZE;
  } catch (err) {
    // 403 是「签到天数不够」，不是错误。服务端那句是英文，视图里会换成中文，
    // 这里只留个标记。
    S.log.error = err.status === 403 ? "locked" : err.message;
    S.log.rows = [];
  } finally {
    S.log.busy = false;
  }
}

async function loadRules() {
  try {
    var d = await jget("/portal/api/rules");
    S.rules = d.rules || [];
    if (d.max) { S.rulesMax = d.max; }
  } catch (e) {
    // 404 说明服务端还没有这个接口；其它错误也按「没开」处理，别把空编辑器
    // 当成可用功能摆出来。
    S.rules = e.status === 404 ? null : null;
  }
}

/* ============================ 视图片段 ============================ */

function card(inner, cls) {
  return '<section class="card p-4 lg:p-5 ' + (cls || "") + '">' + inner + "</section>";
}
function statCard(label, value, hint) {
  return '<div class="card p-4"><div class="stat-l">' + esc(label) + "</div>"
    + '<div class="stat-v mt-1.5">' + value + "</div>"
    + (hint ? '<div class="mt-1 text-[11.5px] dim">' + hint + "</div>" : "") + "</div>";
}
function kv(k, v) {
  return '<div class="kv"><span class="kv-k">' + esc(k) + '</span><span class="kv-v">' + v + "</span></div>";
}

// endpointRow 生成一行「DoT/DoH + 等宽取值 + 复制」。取值本身也可点，因为用户
// 的直觉是点那一串地址。断点放在每个 "/" 之后：换行时断在路径分隔符处，而不是
// 把域名从中间劈开；<wbr> 不影响 textContent，复制到的仍是完整值。
function endpointRow(label, value, note) {
  var html = value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split("/").join("/<wbr>");
  return '<div class="kv"><span class="kv-k w-[3.5rem] shrink-0">' + esc(label) + "</span>"
    + '<span class="min-w-0 flex-1"><span class="flex items-center gap-2 rounded-[10px] border border-line bg-bg px-3 py-2">'
    + '<code class="mono min-w-0 flex-1 text-[12.5px]" style="overflow-wrap:anywhere">' + html + "</code>"
    + '<button class="btn btn-sm shrink-0" data-copy="' + esc(value) + '" type="button">复制</button>'
    + "</span>" + (note ? '<span class="mt-1.5 block text-[11.5px] dim">' + esc(note) + "</span>" : "")
    + "</span></div>";
}

function loginWall(what) {
  return '<div class="mx-auto max-w-md py-12 text-center">'
    + '<div class="mb-2 text-[15px] font-semibold">' + esc(what) + "需要登录</div>"
    + '<p class="mb-5 text-[13px] muted">登录后就能看到自己的数据、日志和规则。</p>'
    + '<div class="flex justify-center gap-2">'
    + '<button class="btn btn-primary" id="wall-login" type="button">登录</button>'
    + (S.cfg.registration_open ? '<button class="btn" id="wall-reg" type="button">注册</button>' : "")
    + "</div></div>";
}

function steps(list) {

// 固定画 30 个槽位，缺失的日子留空槽。服务端有活动之后才开始记历史，按「有几天
// 画几根」的话，新用户的一天会被拉成一整块色块，看不出时间位置。
function sparkHTML(history) {
  history = history || [];
  var byDate = {};
  history.forEach(function (p) { byDate[p.date] = p.requests; });

  // 以服务端给的最后一天为锚点，避免浏览器时区与服务端不一致。
  var last = history.length ? history[history.length - 1].date : fmtDay(new Date());
  var parts = last.split("-");
  var end = new Date(+parts[0], +parts[1] - 1, +parts[2]);

  // 纵轴按历史峰值缩放，并在轴上标出满格代表多少次：按日配额满格的话，配额五万
  // 而实际用量两位数时所有柱子都是 0 高，图表就什么也没说。
  var max = 1;
  history.forEach(function (p) { if (p.requests > max) { max = p.requests; } });

  var bars = "";
  for (var i = HISTORY_DAYS - 1; i >= 0; i--) {
    var d = new Date(end.getFullYear(), end.getMonth(), end.getDate() - i);
    var date = fmtDay(d);
    var n = byDate[date];
    var h = n === undefined ? 0 : Math.max(6, Math.round(n / max * 100));
    bars += '<span class="flex flex-1 items-end" style="max-width:18px" title="'
      + date + (n === undefined ? "：无记录" : "：" + n + " 次") + '">'
      + '<i class="block w-full rounded-[3px]" style="height:' + h + "%;background:"
      + (n === undefined ? "transparent" : "linear-gradient(180deg, color-mix(in srgb, var(--accent) 55%, #fff), var(--accent))")
      + (i === 0 ? ";outline:1.5px solid var(--accent);outline-offset:-1px" : "") + '"></i></span>';
  }

  var startDate = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (HISTORY_DAYS - 1));
  var total = 0;
  history.forEach(function (p) { total += p.requests; });

  var hint;
  if (history.length === 0) { hint = "还没有用量记录，有查询之后这里会显示最近 30 天的趋势。"; }
  else if (history.length === 1) { hint = history[0].date.slice(5) + "，共 " + fmtNum(total) + " 次请求（只有一天数据）。"; }
  else { hint = history[0].date.slice(5) + " 至 " + last.slice(5) + "，共 " + fmtNum(total) + " 次请求。"; }

  return '<div class="flex h-[60px] items-end gap-0.5 border-b border-line pb-0.5">' + bars + "</div>"
    + '<div class="mt-2 flex justify-between text-[11px] dim"><span>' + fmtDay(startDate).slice(5)
    + "</span><span>" + fmtDay(end).slice(5) + " 今天</span></div>"
    + '<p class="mt-2 text-center text-[11.5px] muted">' + hint + "</p>"
    + '<p class="mt-1 text-center text-[11px] dim">'
    + (history.length ? "柱高满格代表 " + fmtNum(max) + " 次" : "") + "</p>";
}

    + card('<div class="stat-l">下一里程碑</div><div class="stat-v mt-1.5">' + fmtNum(c.next_milestone)
      + ' <span class="text-[14px] font-normal dim">天</span></div>'

/* ============================ 视图：排行榜 ============================ */

function viewRanking() {
  var r = S.ranking;
  var isToday = r.order === "today";
  var myUid = S.me && S.me.uid;

  r.entries.forEach(function (e) { if (e.id === myUid) { mine = e; } });

  var html = '<div class="mb-4 flex flex-wrap items-end justify-between gap-3">'
    + '<div><h2 class="text-[18px] font-semibold tracking-tight">排行榜</h2>'

    + (r.updated ? " · 更新于 " + fmtUnix(r.updated) : "") + "</p></div>"
    + '<div class="flex gap-0.5 rounded-[10px] border border-line p-0.5">'
    + '<button class="btn btn-sm ' + (isToday ? "btn-primary" : "btn-ghost") + '" data-order="today" type="button">今日</button>'
    + '<button class="btn btn-sm ' + (!isToday ? "btn-primary" : "btn-ghost") + '" data-order="total" type="button">累计</button>'
    + "</div></div>";

  if (!r.entries.length) {
    html += card('<p class="py-8 text-center text-[13px] dim">还没有人上榜，解析量攒够就会出现在这里。</p>');
    return html;
  }

  html += '<div class="card overflow-hidden">'
    + '<div class="rk-head">'
    + '<span>排名</span><span>用户</span><span class="text-right">解析量</span><span class="text-right">拦截</span>'
    + '<span class="text-right">平均延迟</span></div>'
    + r.entries.map(function (e, i) {
        var n = e.rank || i + 1;
        var amount = isToday ? (e.requests_today || 0) : (e.requests || 0);
        return '<div class="rk-row"'
          + (e.id === myUid ? ' style="background:color-mix(in srgb,var(--accent) 7%,transparent)"' : "") + ">"
          + '<span class="tnum text-[13px] font-semibold' + (n <= 3 ? "" : " dim") + '"'
          + (n <= 3 ? ' style="color:var(--accent)"' : "") + ">" + n + "</span>"
          + '<span class="flex min-w-0 items-center gap-2">' + avatarHTML(e.avatar, e.name, e.id, 28)
          + '<span class="min-w-0"><span class="block truncate text-[13px] font-medium">' + esc(e.name)
          + (e.id === myUid ? ' <span class="text-[11px] dim">我</span>' : "") + "</span>"
          + '<span class="block truncate text-[11px] dim mono">' + esc(e.id) + "</span></span></span>"
          + '<span class="tnum text-right text-[13px] font-medium">' + fmtNum(amount) + "</span>"
          + '<span class="rk-col-sm tnum text-right text-[12.5px] dim">' + fmtNum(e.blocked) + "</span>"
          + '<span class="rk-col-sm tnum text-right text-[12.5px] dim">'
          + msH(e.avg_latency_ms, e.latency_samples) + "</span></div>";
      }).join("")
    + "</div>";

  if (S.me) {
    html += '<div class="mt-3">' + card(mine
      ? '<div class="flex flex-wrap items-center gap-x-3 gap-y-1">'
        + '<span class="tnum text-[15px] font-semibold" style="color:var(--accent)">第 ' + (mine.rank || "?") + " 名</span>"
        + '<span class="text-[13px] muted">解析 ' + fmtNum(isToday ? mine.requests_today : mine.requests)
        + " · 拦截 " + fmtNum(mine.blocked) + " · 平均延迟 " + msH(mine.avg_latency_ms, mine.latency_samples) + "</span></div>"
      : '<span class="text-[13px] muted">你还没上榜 —— 解析量攒够门槛就会自动出现。</span>') + "</div>";
  } else {
    html += '<div class="mt-3">' + card('<div class="flex items-center justify-between gap-3">'
      + '<span class="text-[13px] muted">登录后可以看自己的名次</span>'
      + '<button class="btn btn-sm btn-primary" id="rk-login" type="button">登录</button></div>') + "</div>";
  }

  return html;
}

/* ============================ 视图：查询日志 ============================ */

// 接口给的是 filtering.Reason 的字符串形式，例如 FilteredBlockList、Rewritten、
// NotFilteredNotFound。判定必须走 reason，不能看有没有 blocked 字段。
function entryStatus(e) {
  var r = e.reason || "";
  if (r === "Rewritten") { return tag("改写", "warn"); }
  if (r.indexOf("Filtered") === 0) { return tag("拦截", "bad"); }
  return tag("放行", "good");
}
function entryHost(e) {
  var q = e.question || {};
  return q.unicode_name || q.name || "—";
}

function viewLog() {
  if (!S.me) { return loginWall("查询日志"); }
  var rows = S.log.rows;

  var head = '<div class="mb-4"><h2 class="text-[18px] font-semibold tracking-tight">查询日志</h2>'
    + '<p class="mt-0.5 text-[13px] dim">只显示你自己的记录，不向任何人公开</p></div>';

  if (S.log.error === "locked" || (S.checkin && !S.checkin.log_unlocked)) {
    var need = (S.checkin && S.checkin.log_unlock_streak) || 3;
    var have = (S.checkin && S.checkin.streak) || 0;
    return head + card('<div class="sect mb-1">查询日志还没解锁</div>'
      + '<p class="text-[13px] muted">连续签到满 ' + fmtNum(need) + ' 天才能查看，你现在是 '
      + fmtNum(have) + ' 天。</p>'
      + '<div class="hr"></div>'
      + '<button class="btn btn-sm btn-primary" id="log-to-checkin" type="button">去签到</button>');
  }

  if (S.log.error) {
    return head + card('<p class="text-[13px]" style="color:var(--bad)">' + esc(S.log.error) + "</p>");
  }

  return '<div class="mb-4 flex flex-wrap items-end justify-between gap-3">'
    + '<div><h2 class="text-[18px] font-semibold tracking-tight">查询日志</h2>'
    + '<p class="mt-0.5 text-[13px] dim">只显示你自己的记录，不向任何人公开</p></div>'
    + '<div class="flex gap-2"><input class="input !w-36 sm:!w-56" id="log-term" placeholder="按域名筛选" value="'
    + esc(S.log.term) + '"><button class="btn shrink-0" id="log-go" type="button">查询</button></div></div>'
    + '<div class="card overflow-hidden">'
    + (rows.length
      ? rows.map(function (e) {
          var ans = e.answer || [];
          var meta = [];
          if (e.question && e.question.type) { meta.push(e.question.type); }
          if (e.time) { meta.push(fmtISO(e.time)); }
          if (ans.length) { meta.push(ans.slice(0, 2).join(", ")); }
          if (e.client) { meta.push(e.client); }
          return '<div class="flex items-start gap-3 border-b border-line px-4 py-2.5 last:border-b-0">'
            + '<span class="mt-0.5 shrink-0">' + entryStatus(e) + "</span>"
            + '<span class="min-w-0 flex-1"><span class="mono block truncate text-[13.5px]" title="'
            + esc(entryHost(e)) + '">' + esc(entryHost(e)) + "</span>"
            + '<span class="mt-0.5 block truncate text-[11.5px] dim">' + esc(meta.join(" · ")) + "</span></span></div>";
        }).join("")
      : '<p class="py-8 text-center text-[13px] dim">'
        + (S.log.term ? "没有匹配的记录" : "还没有记录。") + "</p>")
    + "</div>"
    + '<div class="mt-3 flex flex-wrap items-center gap-3">'
    + '<button class="btn btn-sm" id="log-refresh" type="button">刷新</button>'
    + (S.log.exhausted || !rows.length ? "" : '<button class="btn btn-sm" id="log-more" type="button">加载更多</button>')
    + '<span class="text-[12px] dim">已显示 ' + fmtNum(rows.length) + " 条</span></div>";
}

      + '<div><div class="sect">服务端还没开启这项功能</div>'

      + esc(rules.join("\n")) + "</textarea>"

/* ============================ 渲染与事件 ============================ */

var VIEWS = {
  dashboard: viewDashboard,
  dns: viewDNS,
  checkin: viewCheckin,
  ranking: viewRanking,
  log: viewLog,
  rules: viewRules,
};

function render() {
  renderNav();
  renderTop();
  renderSideUser();
  $("top-title").textContent = TITLES[S.view] || "仪表盘";
  $("view").innerHTML = (VIEWS[S.view] || viewDashboard)();
  wire();
}

function bind(id, fn) {
  var el = $(id);
  if (el) { el.onclick = fn; }
}

function wire() {
  bind("dash-login", function () { openLogin(""); });
  bind("dash-login2", function () { openLogin(""); });
  bind("dash-reg", openRegister);
  bind("wall-login", function () { openLogin(""); });
  bind("wall-reg", openRegister);
  bind("rk-login", function () { openLogin(""); });
  bind("dns-logout", logout);

  // 复制按钮：取值本身也可点，因为用户的直觉是点那一串地址。
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function (b) {
    b.onclick = function () { copyText(b.getAttribute("data-copy"), b); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("code[data-copy]"), function (c) {
    c.onclick = function () { copyText(c.getAttribute("data-copy"), null, c); };
  });

  bind("do-checkin", async function () {
    var btn = $("do-checkin");
    btn.disabled = true;
    btn.textContent = "签到中…";
    try {
      S.checkin = await jget("/portal/api/checkin", { method: "POST" });
      await loadMe();
      toast("签到成功，连续 " + fmtNum(S.checkin && S.checkin.streak) + " 天", "ok");
      render();
    } catch (err) {
      toast(err.message, "bad");
      btn.disabled = false;
      btn.textContent = "立即签到";
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-order]"), function (b) {
    b.onclick = async function () {
      try { await loadRanking(b.getAttribute("data-order")); render(); }
      catch (err) { toast(err.message, "bad"); }
    };
  });

  bind("log-to-checkin", function () { location.hash = "#/checkin"; });
  bind("log-go", async function () {
    S.log.term = $("log-term").value.trim();
    S.log.exhausted = false;
    try { await loadLog(true); render(); } catch (err) { toast(err.message, "bad"); }
  });
  bind("log-refresh", async function () {
    S.log.exhausted = false;
    try { await loadLog(true); render(); toast("已刷新"); } catch (err) { toast(err.message, "bad"); }
  });
  bind("log-more", async function () {
    try { await loadLog(false); render(); } catch (err) { toast(err.message, "bad"); }
  });
  var term = $("log-term");
  if (term) {
    term.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); $("log-go").click(); } };
  }

  bind("rules-save", async function () {
    var btn = $("rules-save");
    btn.disabled = true;
    try {
      var list = $("rules-box").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      var d = await jget("/portal/api/rules", { method: "POST", body: { rules: list } });
      S.rules = d.rules || list;
      toast("已保存", "ok");
      render();
    } catch (err) {
      toast(err.message, "bad");
      btn.disabled = false;
    }
  });

  bind("pass-btn", async function () {
    var btn = $("pass-btn");
    var hint = $("pass-hint");
    btn.disabled = true;
    hint.textContent = "";
    try {
      await jget("/portal/api/password", {
        method: "POST",
        body: { old_password: $("pass-old").value, new_password: $("pass-new").value },
      });
      $("pass-old").value = "";
      $("pass-new").value = "";
      hint.textContent = "密码已修改";
      hint.style.color = "var(--good)";
    } catch (err) {
      hint.textContent = err.message;
      hint.style.color = "var(--bad)";
    } finally {
      btn.disabled = false;
    }
  });
}

/* ============================ 启动 ============================ */

// 视图需要的数据按需拉：没登录的页面不碰私有接口。
async function enterView() {
  try {
    if (S.view === "ranking") { await loadRanking(); }
    if (S.view === "log" && S.me && S.log.rows.length === 0) { await loadLog(true); }
    if (S.view === "rules" && S.me && S.rules === undefined) { await loadRules(); }
  } catch (err) {
    toast(err.message, "bad");
  }
}

function routeFromHash() {
  var m = /^#\/([a-z]+)$/.exec(location.hash || "");
  S.view = m && VIEWS[m[1]] ? m[1] : "dashboard";
}

async function boot() {
  applyTheme(themeMode());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if (themeMode() === "auto") { applyTheme("auto"); }
  });

  routeFromHash();
  render();

  // 先拉配置，再同时拉公共统计和会话。未登录时看到的是公共战报，不是登录表单 ——
  // 服务有什么可看的先摆出来，要登录再点。
  await loadConfig();
  await Promise.all([loadPublic(), loadMe()]);

  $("side-domain").textContent = (S.pub && S.pub.domain) || "";
  $("foot-domain").textContent = (S.pub && S.pub.domain) ? " · " + S.pub.domain : "";
  render();

  await enterView();
  render();
}

window.addEventListener("hashchange", async function () {
  routeFromHash();
  closeDrawer();
  render();
  await enterView();
  render();
});

document.addEventListener("DOMContentLoaded", function () {
  $("menu-btn").onclick = openDrawer;
  $("overlay").onclick = closeDrawer;
  $("theme-btn").onclick = function () {
    var order = ["auto", "light", "dark"];
    applyTheme(order[(order.indexOf(themeMode()) + 1) % order.length]);
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); closeDrawer(); }
  });
  boot();
});
</script>
</body>
</html>
