name: AGHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Run the Go tests
        run: go test ./internal/users/... ./internal/selfupdate/...

      - name: Build the frontend
        run: |
          cd client_v2
          npm ci --no-audit --no-fund
          npm run build-prod

      - name: Build and pack the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SKIP_JS: '1'
        run: sh ./scripts/aghub-release.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AGHub ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist-aghub/*.tar.gz
            dist-aghub/*.zip
            dist-aghub/checksums.txt
