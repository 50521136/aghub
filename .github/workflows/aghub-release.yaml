name: AGHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release notes are generated from the commit history and the
          # previous tag, so a shallow clone silently produces "first release"
          # instead of the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Run the Go tests
        run: go test ./internal/users/... ./internal/selfupdate/...

      - name: Build the frontend
        run: |
          cd client_v2
          npm ci --no-audit --no-fund
          npm run build-prod

      - name: Build and pack the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SKIP_JS: '1'
        run: bash ./scripts/aghub-release.sh

      - name: Generate the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo '::error::the repository is shallow, so the notes would fall back to "first release"; check out with fetch-depth: 0'
            exit 1
          fi

          bash ./scripts/aghub-changelog.sh "${VERSION}" "${GITHUB_REPOSITORY}" > notes.md
          echo '--- notes.md ---'
          cat notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AGHub ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            dist-aghub/*.tar.gz
            dist-aghub/*.zip
            dist-aghub/checksums.txt

